      - Plan de Reprise d'Activité (PRA): 01-architecture/04-disaster-recovery.md
  - 2. Composants Clés:
      - Portail & Dashboard CMP: 02-core-components/01-cmp-dashboard.md
      - Identités & Keycloak: 02-core-components/02-identity-keycloak.md
      - Secrets & HashiCorp Vault: 02-core-components/03-secrets-vault.md
      - Synchronisation GitOps ArgoCD: 02-core-components/04-gitops-argocd.md
