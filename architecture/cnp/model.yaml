connections:
  # Request path.
  - {id: e-1-browser-edge, from: user, to: cf-edge, port: https, protocol: HTTPS, verb: GET app, kind: flow}
  - {id: e-2-tunnel-app, from: cloudflared-app, to: cf-edge, port: quic, protocol: QUIC, verb: open tunnel, kind: tunnel}
  - {id: e-3-connector-envoy, from: cloudflared-app, to: envoy-shared-gateway, port: http, protocol: HTTP, verb: forward, kind: flow}
  - {id: e-4-envoy-service, from: envoy-shared-gateway, to: app-service, port: http, protocol: HTTP, verb: proxy, kind: flow}
  - {id: e-5-service-pods, from: app-service, to: app-pods, port: http, verb: DNAT, kind: flow}
  - {id: e-6-pods-db, from: app-pods, to: cnpg, port: postgres, protocol: SQL, verb: query, kind: flow}

  # Authentication. Their order lives in the OIDC sequence view.
  - {id: e-oidc-platform-tunnel, from: cloudflared-platform, to: cf-edge, port: quic, protocol: QUIC, verb: open tunnel, kind: tunnel}
  - {id: e-oidc-platform-envoy, from: cloudflared-platform, to: envoy-shared-gateway, port: http, protocol: HTTP, verb: forward auth.3istor.com, kind: auth}
  - {id: e-oidc-envoy-keycloak, from: envoy-shared-gateway, to: keycloak, port: http, protocol: HTTP, verb: OIDC, kind: auth}
  - {id: e-oidc-token-hairpin, from: envoy-shared-gateway, to: cf-edge, port: https, protocol: HTTPS, verb: OIDC token call, kind: auth}

  # Background work.
  - {id: e-a-vso-vault, from: vso, to: vault, port: http, protocol: HTTP, verb: read, kind: async}
  - {id: e-b-vso-secret, from: vso, to: app-secret, protocol: K8s API, verb: write Secret, kind: async}

  # Portal and GitOps. The CMP's admin calls to Keycloak and Vault go through a
  # Terraform bootstrap and are described in the overview's cards, not drawn.
  - {id: c-envoy-cmp-frontend, from: envoy-shared-gateway, to: cmp-frontend, port: http, protocol: HTTP, verb: route cmp.3istor.com, kind: flow}
  - {id: c-envoy-cmp-backend, from: envoy-shared-gateway, to: cmp-backend, port: http, protocol: HTTP, verb: route /api, kind: flow}
  - {id: c-cmp-github, from: cmp-backend, to: github, port: https, protocol: HTTPS, verb: write project record, kind: flow}
  - {id: c-argocd-github, from: argocd, to: github, port: https, protocol: HTTPS, verb: poll Git, kind: async}
  - {id: c-argocd-apiserver, from: argocd, to: kube-apiserver, port: https, protocol: HTTPS, verb: apply, kind: async}

  # Multicloud (docs/06-multicloud): user traffic stays on the project's cloud; only
  # the control plane reaches back to the hub, over the VPN for a public cloud.
  - {id: c-a-tunnel-edge, from: a-tunnel, to: cf-edge, port: quic, protocol: QUIC, verb: open tunnel, kind: tunnel}
  - {id: c-a-tunnel-gw, from: a-tunnel, to: a-gateway, port: http, protocol: HTTP, verb: forward, kind: flow}
  - {id: c-a-gw-kc, from: a-gateway, to: a-keycloak, port: http, protocol: HTTP, verb: OIDC, kind: auth}
  - {id: c-a-gw-a1, from: a-gateway, to: a1-front, port: http, protocol: HTTP, verb: route, kind: flow}
  - {id: c-a1-front-back, from: a1-front, to: a1-back, port: http, protocol: HTTP, verb: call API, kind: flow}
  - {id: c-a1-back-db, from: a1-back, to: a1-db, port: postgres, protocol: SQL, verb: query, kind: flow}
  - {id: c-a-gw-a2, from: a-gateway, to: a2-front, port: http, protocol: HTTP, verb: route, kind: flow}
  - {id: c-a2-front-back, from: a2-front, to: a2-back, port: http, protocol: HTTP, verb: call API, kind: flow}
