  - {id: sb-svc, kind: backend, parent: g-sb-crd, icon: k8s-svc, title: "Service <id>", tech: "[headless · created by controller]", desc: "Stable DNS name for the sandbox:<br><id>.<ns>.svc.cluster.local.<br>Why: router and SDK find the pod.", status: planned, target: IA-2}
  - {id: sb-sandbox, kind: backend, parent: g-sb-crd, icon: k8s-crd, title: "Sandbox <id>", tech: "[agents.x-k8s.io/v1beta1]", desc: "One stateful pod with a stable name.<br>status: serviceFQDN, podIPs, Ready.<br>Why: the unit the controller runs.", status: planned, target: IA-2}
