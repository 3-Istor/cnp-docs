  - {id: c-argocd-apiserver, from: argocd, to: kube-apiserver, port: https, protocol: HTTPS, verb: apply, kind: async}

  # Multicloud (docs/06-multicloud): user traffic stays on the project's cloud; only
  # the control plane reaches back to the hub, over the VPN for a public cloud.
  - {id: c-a-tunnel-edge, from: a-tunnel, to: cf-edge, port: quic, protocol: QUIC, verb: open tunnel, kind: tunnel}
