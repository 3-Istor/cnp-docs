annotations:
  - {id: G1, severity: high, title: "Network isolation", targets: [x-cross-tenant]}
  - {id: G2, severity: high, title: "Authorization", targets: [security-policy]}
  - {id: G3, severity: medium, title: "Transport", targets: [cf-edge]}
  - {id: G4, severity: medium, title: "Coupling", targets: [envoy-shared-gateway]}
  - {id: G5, severity: low, title: "Tunnels", targets: [cloudflared-app]}
  - {id: G6, severity: medium, title: "Token call", targets: [envoy-shared-gateway, e-oidc-token-hairpin]}
  - {id: G7, severity: high, title: "CMP API auth", targets: [cmp-backend, c-envoy-cmp-backend]}
  - {id: G8, severity: high, title: "Pod sandbox", targets: [app-pods]}
  - {id: G9, severity: medium, title: "Keycloak ReferenceGrant", targets: [security-policy]}
  - {id: G10, severity: medium, title: "Shared gateway label", targets: [httproute]}
  - {id: G13, severity: medium, title: "Secret operator", text: "The Ricoberger vault-secrets-operator (chart 3.0.0, image v1.26.0), not HashiCorp VSO, on the hub and on both clouds: whether a synced Secret survives a Vault outage is untested (GD-1).", targets: [b-secret-op, gke-secret-op]}
  - {id: G15, severity: high, title: "CMP Vault token", text: "The CMP's VAULT_TOKEN comes from kvv2/arcl-cmp; its policy was not checked. Drawn as the root token, the worst case.", targets: [vault-root-token]}
  - {id: G17, severity: high, title: "GitOps write", text: "main is unprotected on K3s, cnp-projects, cnp-project-base, app-templates and CMP (checked 2026-10-02); the members' base permission was not checked. Whoever pushes to the GitOps repos deploys anywhere through Argo CD.", targets: [gh-base]}
  - {id: G16, severity: medium, title: "Cloudflare token scope", text: "CLOUDFLARE_API_TOKEN scope was not checked. Drawn as write on the zone and tunnels.", targets: [cf-token]}
  - {id: G18, severity: medium, title: "Sync after a long down", text: "CNP-112: after a long down, Argo CD sync operations keep retrying against the destroyed cluster address; a manual unblock is needed.", targets: [c-argocd-b]}
  - {id: G19, severity: low, title: "Frontend start order", text: "CNP-114: the frontend nginx resolves the backend at start and crashes until the backend Service exists.", targets: [b1-front]}
  - {id: G20, severity: low, title: "Shared VaultSecret", text: "CNP-115: fullstack apps render the VaultSecret app-registry from both Applications; one stays OutOfSync.", targets: [b1-back]}

