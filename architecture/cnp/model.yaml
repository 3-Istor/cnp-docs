  - {id: sb-containerd-kata, kind: backend, parent: g-sb-node-kata, icon: docker, title: "containerd", tech: "[CRI · K3s embedded]", desc: "Pulls images, picks the runtime<br>handler from the RuntimeClass.<br>Already runs today."}
