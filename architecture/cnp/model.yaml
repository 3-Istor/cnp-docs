  - {id: ag-backend-ollama, kind: backend, parent: g-ag-crd-eg, icon: k8s-crd, title: "Backend ollama", tech: "[IP :11434 · WireGuard]", desc: "Network target for Ollama: homelab IP<br>on port 11434, through WireGuard.<br>Why: GPU lives outside the cluster.", status: planned, target: IA-1}
  - {id: ag-secret, kind: database, parent: g-ag-crd-eg, icon: k8s-secret, title: "Secret gemini-api-key", tech: "[key apiKey]", desc: "Holds the Gemini API key.<br>Written by VSO from Vault.<br>Why: the key never lives in Git.", status: planned, target: IA-1}
  - {id: ag-httproute, kind: backend, parent: g-ag-gen, icon: k8s-crd, title: "HTTPRoute + filter", tech: "[one per AIGatewayRoute]", desc: "Plain Gateway API route the controller<br>derives from the AIGatewayRoute.<br>Why: Envoy Gateway only reads these.", status: planned, target: IA-1}
  - {id: ag-extproc-secret, kind: database, parent: g-ag-gen, icon: k8s-secret, title: "ExtProc config", tech: "[Secret · filterconfig.yaml]", desc: "Config file for the sidecar: routes,<br>schemas, costs and the API key.<br>Why: sidecar reads it, no API calls.", status: planned, target: IA-1}
  - {id: ag-eg-infra, kind: tool, parent: g-ag-eg-ctrl, icon: k8s-deploy, title: "Infra manager", tech: "[Envoy Gateway controller]", desc: "Creates the Envoy Deployment and<br>Service for each Gateway.<br>Already runs for shared-gateway."}
  - {id: ag-eg-xds, kind: backend, parent: g-ag-eg-ctrl, icon: envoy-gateway, title: "xDS server", tech: "[gRPC ADS]", desc: "Streams config to Envoy (xDS).<br>Envoy reloads without restart.<br>Already runs today."}
  - {id: ag-eg-translate, kind: backend, parent: g-ag-eg-ctrl, icon: envoy-gateway, title: "Gateway API translator", tech: "[Envoy Gateway controller]", desc: "Turns Gateway API objects and<br>policies into Envoy config.<br>Already runs today."}
  - {id: ag-c-ext, kind: backend, parent: g-ag-ar-ctrl, icon: k8s-deploy, title: "Extension server", tech: "[EG extension API · gRPC]", desc: "Hooks into Envoy Gateway's translation<br>to add what Gateway API can't express:<br>upstream filters, backend priorities.", status: planned, target: IA-1}
  - {id: ag-c-reconcile, kind: backend, parent: g-ag-ar-ctrl, icon: k8s-deploy, title: "Reconcilers", tech: "[controller-runtime]", desc: "Watches the Agent Router CRDs and<br>writes the generated objects.<br>Why: you edit intent, not plumbing.", status: planned, target: IA-1}
  - {id: ag-c-cfg, kind: tool, parent: g-ag-ar-ctrl, icon: k8s-deploy, title: "ExtProc config builder", tech: "[one per Gateway]", desc: "Assembles the sidecar config file<br>from all routes, backends and keys.<br>Why: sidecar needs one complete view.", status: planned, target: IA-1}
  - {id: ag-c-webhook, kind: security, parent: g-ag-ar-ctrl, icon: k8s-deploy, title: "Sidecar injector", tech: "[mutating webhook]", desc: "Adds the ExtProc container to every<br>Envoy pod when it is created.<br>Why: no manual Envoy patching.", status: planned, target: IA-1}
  - {id: ag-kapi, kind: backend, parent: g-ag-kapi, icon: kubernetes, title: "Kubernetes API", tech: "[K3s apiserver]", desc: "Stores every object above and<br>notifies the controllers.<br>Already runs today (K3s)."}
  - {id: ag-f-listener, kind: backend, parent: g-ag-envoy, icon: envoy, title: "Listener :8080", tech: "[HTTP connection manager]", desc: "Port where requests enter Envoy.<br>HTTP parsing, timeouts, streaming.<br>Internal Service, no public route.", status: planned, target: IA-1}
  - {id: ag-f-jwt, kind: security, parent: g-ag-envoy, icon: envoy, title: "jwt_authn · rbac", tech: "[from SecurityPolicy]", desc: "Checks the caller's Keycloak JWT and<br>its project claim before anything else.<br>Why: reject early, before any cost.", status: planned, target: IA-1}
  - {id: ag-f-xp-router, kind: backend, parent: g-ag-envoy, icon: envoy, title: "ext_proc · router", tech: "[gRPC over Unix socket]", desc: "Sends headers and body to the sidecar,<br>gets back x-ai-eg-model to route on.<br>Why: Envoy routes on headers, not body.", status: planned, target: IA-1}
  - {id: ag-f-rl, kind: backend, parent: g-ag-envoy, icon: envoy, title: "ratelimit", tech: "[global · BackendTrafficPolicy]", desc: "Asks the rate limit service if the<br>project has tokens left; adds the<br>real cost once the answer is known.", status: planned, target: IA-1}
  - {id: ag-f-router, kind: backend, parent: g-ag-envoy, icon: envoy, title: "router", tech: "[route on x-ai-eg-model]", desc: "Chooses the backend: Gemini first,<br>Ollama on 429 (retry, priority 1).<br>Standard Envoy router, AI-unaware.", status: planned, target: IA-1}
  - {id: ag-f-xp-up, kind: backend, parent: g-ag-envoy, icon: envoy, title: "Upstream filters", tech: "[ext_proc upstream · cluster]", desc: "Runs per backend, again on each retry:<br>translates and signs the request,<br>then reads the response.", status: planned, target: IA-1}
  - {id: ag-x-parse, kind: backend, parent: g-ag-xp, icon: envoy, title: "Request parser", tech: "[router phase]", desc: "Reads model, stream flag and messages<br>from the JSON body.<br>Why: routing depends on the model.", status: planned, target: IA-1}
  - {id: ag-x-usage, kind: backend, parent: g-ag-xp, icon: envoy, title: "Response processor", tech: "[JSON + SSE parser]", desc: "Reads token usage from the answer<br>(JSON or the last SSE chunk).<br>Why: cost-based limits and FinOps.", status: planned, target: IA-1}
  - {id: ag-x-mcp, kind: backend, parent: g-ag-xp, icon: mcp, title: "MCP proxy", tech: "[MCPRoute · sessions]", desc: "Merges tools of several MCP servers,<br>prefixes names (cmp__tool), keeps<br>sessions. One endpoint for agents.", status: planned, target: IA-2}
  - {id: ag-x-translate, kind: backend, parent: g-ag-xp, icon: envoy, title: "Translator", tech: "[OpenAI → backend schema]", desc: "Rewrites path and body to the format<br>the chosen provider expects.<br>Why: agents speak one API (OpenAI).", status: planned, target: IA-1}
  - {id: ag-x-otel, kind: tool, parent: g-ag-xp, icon: opentelemetry, title: "Telemetry", tech: "[OTel GenAI conventions]", desc: "Exports GenAI metrics and spans:<br>tokens, latency, time to 1st token.<br>Why: cost and speed per project.", status: planned, target: IA-1}
  - {id: ag-x-auth, kind: security, parent: g-ag-xp, icon: k8s-secret, title: "Backend auth", tech: "[BackendSecurityPolicy]", desc: "Adds the provider credential<br>(Authorization: Bearer key).<br>Why: agents never see the key.", status: planned, target: IA-1}
  - {id: ag-rl, kind: backend, parent: g-ag-rl, icon: envoy, title: "envoy-ratelimit", tech: "[gRPC · descriptors]", desc: "Counts tokens per project and model<br>against configured budgets.<br>Why: keep within the free quota.", status: planned, target: IA-1}
  - {id: ag-redis, kind: database, parent: g-ag-rl, icon: redis, title: "Redis", tech: "[counters with TTL]", desc: "Stores the counters with a TTL<br>per time window.<br>Shared by all Envoy replicas.", status: planned, target: IA-1}

