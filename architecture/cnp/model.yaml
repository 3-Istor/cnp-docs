  - {id: ag-gatewayclass, kind: backend, parent: g-ag-crd-gw, icon: k8s-crd, title: "GatewayClass agentgateway", tech: "[Gateway API · cluster scoped]", desc: "Hands the Gateways of this class to<br>the agentgateway controller.<br>Why: apart from Envoy Gateway's class.", status: planned, target: IA-1}
  - {id: ag-gateway, kind: backend, parent: g-ag-crd-gw, icon: k8s-crd, title: "Gateway ai-gateway", tech: "[gatewayClassName agentgateway]", desc: "The entry point: one listener, reachable<br>inside the cluster only.<br>Why: every agent call goes through it.", status: planned, target: IA-1}
  - {id: ag-route, kind: backend, parent: g-ag-crd-gw, icon: k8s-crd, title: "HTTPRoute llm", tech: "[PathPrefix /v1]", desc: "Sends model calls to the llm backend.<br>Why: one OpenAI-compatible entry.", status: planned, target: IA-1}
  - {id: md-route-local, kind: backend, parent: g-ag-crd-gw, icon: k8s-crd, title: "HTTPRoute llm-local", tech: "[header x-cnp-data: local]", desc: "Same path, llm-local backend only.<br>Why: Local data never leaves.", status: planned, target: IA-1}
  - {id: ag-mcproute, kind: backend, parent: g-ag-crd-gw, icon: k8s-crd, title: "HTTPRoute mcp", tech: "[PathPrefix /mcp]", desc: "Sends tool calls to the mcp backend.<br>Why: one endpoint for all tools.", status: planned, target: IA-2}
  - {id: ag-a2aroute, kind: backend, parent: g-ag-crd-gw, icon: k8s-crd, title: "HTTPRoute a2a", tech: "[PathPrefix /a2a/<agent>]", desc: "Rewrites the prefix to / and sends the<br>call to the agent's a2a backend.", status: planned, target: IA-2}
  - {id: ag-secret, kind: database, parent: g-ag-crd-agw, icon: k8s-secret, title: "Secrets gemini-api-key-*", tech: "[key Authorization · one per key]", desc: "The Gemini keys, written by VSO.<br>Why: the keys never live in Git.", status: planned, target: IA-1}
  - {id: ag-secret-gpu, kind: database, parent: g-ag-crd-agw, icon: k8s-secret, title: "Secret gpu-server-token", tech: "[key Authorization]", desc: "The token the GPU server's proxy<br>expects, written by VSO from Vault.", status: planned, target: IA-1}
  - {id: ag-pol-auth, kind: security, parent: g-ag-pol, icon: k8s-crd, title: "AgentgatewayPolicy auth", tech: "[traffic.jwtAuthentication + authorization]", desc: "Keycloak JWT (iss, aud, JWKS), then CEL<br>rules on its claims; no match: 403.<br>Why: no anonymous model access.", status: planned, target: IA-1}
  - {id: ag-pol-rate, kind: security, parent: g-ag-pol, icon: k8s-crd, title: "AgentgatewayPolicy budget", tech: "[traffic.rateLimit.global · Tokens]", desc: "Daily token budget per agent, keyed by a JWT<br>claim (azp) in the rate limit service.<br>Over the budget: 429. Why: cap one agent.", status: planned, target: IA-1}
  - {id: ag-pol-limits, kind: security, parent: g-ag-pol, icon: k8s-crd, title: "AgentgatewayPolicy limits", tech: "[traffic.rateLimit.local · max_tokens]", desc: "30 requests a minute per agent (local<br>limiter); max_tokens capped at 4,096.<br>Why: bound one call and one burst.", status: planned, target: IA-1}
  - {id: ag-pol-guard, kind: security, parent: g-ag-polb, icon: k8s-crd, title: "AgentgatewayPolicy guard", tech: "[backend.ai.promptGuard]", desc: "Regex masks PII and secrets, then the<br>webhook; no answer: refused.<br>Why: check the prompt before the model.", status: planned, target: IA-2}
  - {id: ag-pol-failover, kind: security, parent: g-ag-polb, icon: k8s-crd, title: "AgentgatewayPolicy failover", tech: "[backend.health · traffic.retry]", desc: "Evicts a provider on 429 so the next<br>group takes over; retry resends.<br>Why: free quota spent, GPU answers.", status: planned, target: IA-1}
  - {id: ag-pol-tools, kind: security, parent: g-ag-polb, icon: k8s-crd, title: "AgentgatewayPolicy tools", tech: "[backend.mcp.authorization]", desc: "CEL on the claims and mcp.tool.name:<br>which agent may call which tool.<br>Why: per-tool rights, no extra service.", status: planned, target: IA-2}
  - {id: ag-pol-trace, kind: backend, parent: g-ag-pol, icon: k8s-crd, title: "AgentgatewayPolicy trace", tech: "[frontend.tracing · OTLP gRPC]", desc: "Sends the spans to Alloy.<br>Why: one trace from agent to tool.", status: planned, target: IA-1}
  - {id: ag-c-krt, kind: backend, parent: g-ag-ctrl, icon: k8s-deploy, title: "Translator", tech: "[krt collections]", desc: "Turns Gateway API and agentgateway<br>objects into proxy configuration.<br>Why: you edit intent, not plumbing.", status: planned, target: IA-1}
  - {id: ag-c-xds, kind: backend, parent: g-ag-ctrl, icon: k8s-deploy, title: "xDS server", tech: "[gRPC ADS · delta updates]", desc: "Streams the configuration to the proxy,<br>applied without a restart.", status: planned, target: IA-1}
  - {id: ag-c-deploy, kind: backend, parent: g-ag-ctrl, icon: k8s-deploy, title: "Deployer", tech: "[one proxy per Gateway]", desc: "Creates the proxy Deployment for each<br>Gateway of the agentgateway class.<br>Why: no proxy to run by hand.", status: planned, target: IA-1}
  - {id: ag-c-status, kind: backend, parent: g-ag-ctrl, icon: k8s-deploy, title: "Status writer", tech: "[Gateway · listener · route]", desc: "Reports accepted or rejected on the<br>Gateway API objects.<br>Why: a rejected route is visible.", status: planned, target: IA-1}
  - {id: ag-f-listener, kind: backend, parent: g-ag-chain, icon: k8s-pod, title: "Listener :8080", tech: "[frontend · HTTP]", desc: "Where requests enter.<br>Internal Service, no public route.", status: planned, target: IA-1}
  - {id: ag-f-jwt, kind: security, parent: g-ag-chain, icon: k8s-pod, title: "jwtAuthentication", tech: "[traffic · Strict]", desc: "Checks signature (cached JWKS), iss<br>and aud before anything else.<br>Why: reject early, before any cost.", status: planned, target: IA-1}
  - {id: ag-f-authz, kind: security, parent: g-ag-chain, icon: k8s-pod, title: "authorization", tech: "[traffic · CEL · Allow]", desc: "Allow rules on the claims; no rule<br>matches: 403.<br>Why: deny by default.", status: planned, target: IA-1}
  - {id: ag-f-rl, kind: backend, parent: g-ag-chain, icon: k8s-pod, title: "rateLimit", tech: "[traffic · global · Tokens]", desc: "Asks the rate limit service if the budget<br>is spent; service down: refused (fail-closed).<br>Why: a 429 before any model cost.", status: planned, target: IA-1}
  - {id: ag-f-route, kind: backend, parent: g-ag-chain, icon: k8s-pod, title: "Route match", tech: "[HTTPRoute · backendRef]", desc: "Picks the route by path and header,<br>then its AgentgatewayBackend.<br>Why: Local calls get llm-local.", status: planned, target: IA-1}
  - {id: ag-f-guard, kind: security, parent: g-ag-chain, icon: k8s-pod, title: "promptGuard", tech: "[backend.ai · regex, webhook]", desc: "Masks PII and secrets, then asks the<br>guardrail adapter. Down: refused.<br>Why: check the prompt before the model.", status: planned, target: IA-2}
  - {id: ag-f-pick, kind: backend, parent: g-ag-chain, icon: k8s-pod, title: "Provider choice", tech: "[groups · P2C · health]", desc: "Best healthy provider of group 1;<br>on 429 it is evicted, group 2 follows.<br>Why: the free quota lasts.", status: planned, target: IA-1}
  - {id: ag-x-llm, kind: backend, parent: g-ag-chain, icon: k8s-pod, title: "LLM proxy", tech: "[OpenAI-compatible · policies.auth]", desc: "Reads model and token usage, speaks the<br>provider's API with its key from the Secret.<br>Why: agents speak one API, hold no key.", status: planned, target: IA-1}
  - {id: ag-x-mcp, kind: backend, parent: g-ag-proto, icon: mcp, title: "MCP proxy", tech: "[backend.mcp · streamable HTTP]", desc: "Serves the tools of its targets behind<br>one /mcp endpoint.<br>Why: agents see one tool server.", status: planned, target: IA-2}
  - {id: ag-x-a2a, kind: backend, parent: g-ag-proto, icon: k8s-pod, title: "A2A proxy", tech: "[backend a2a · JSON-RPC]", desc: "Relays tasks between agents.<br>Why: agents talk through the gateway.", status: planned, target: IA-2}
  - {id: ag-x-otel, kind: tool, parent: g-ag-pod, icon: opentelemetry, title: "Telemetry", tech: "[OTel GenAI · spans, metrics]", desc: "Spans over OTLP; token and cost<br>metrics on :15020 for scraping.<br>Why: cost and speed per agent.", ports: [{name: metrics, protocol: TCP, port: 15020}], status: planned, target: IA-1}
  - {id: ag-rl, kind: backend, parent: g-ag-rl, icon: envoy, title: "Rate limit service", tech: "[envoyproxy/ratelimit · gRPC]", desc: "Counts tokens per agent and per day against<br>the limits of the ConfigMap ratelimit-config.<br>Why: one shared budget.", ports: [{name: grpc, protocol: TCP, port: 8081}], status: planned, target: IA-1}
  - {id: ag-redis, kind: database, parent: g-ag-rl, icon: redis, title: "Redis", tech: "[counters with TTL]", desc: "Stores the counters per window.<br>Why: shared by the service replicas.", status: planned, target: IA-1}
  - {id: ag-hook, kind: security, parent: g-ag-hook, icon: python, title: "Guardrail adapter", tech: "[in-house · POST /request]", desc: "Turns the gateway's webhook call into<br>a Llama Guard check on the GPU server.<br>Why: the two formats do not match.", status: planned, target: IA-2}
