notes:
  - {id: n-id-two, text: "Two ways to get a token. Alone: client_credentials with the agent's own secret, sub is its service account. For a user: token exchange of the user's token, sub stays the user and azp says which agent acts."}
  - {id: n-id-aud, text: "Keycloak only exchanges a token whose audience lists the requesting client: the CMP client's scope must add the agent clients to aud, and exchange-guard limits what comes out."}
  - {id: n-id-later, text: "Phase 1 uses the client secret (Secret agent-oidc, from Vault). In phase 2 agents authenticate with their ServiceAccount token (federated client authentication, Keycloak 26.6) and the secret goes away."}
  - {id: n-id-cmp, text: "CMP tools: the CMP's MCP server has its own audience, cmp-mcp. An agent that uses CMP tools gets the optional client scope cmp-tools, which adds cmp-mcp to aud: it asks for that token with scope=cmp-tools, or by exchange with audience=cmp-mcp when it acts for a user. Gateway tokens keep aud ai-gateway. On /mcp the gateway checks the JWT without changing it and the CMP checks it again (04-cmp-agents, section 7)."}

cards:
  - id: card-steps
    title: "Request path · an agent gets and uses a token"
    color: emerald
    lines:
      - "[1] Agent on its own: client_credentials with its client id and secret; Keycloak returns a 5-minute JWT, aud ai-gateway, project claim, no refresh token."
      - "[2] The agent calls the AI gateway with that JWT. [3] The gateway checks the signature with Keycloak's cached JWKS, then the claims. For CMP tools the agent asks a second token with scope=cmp-tools: aud cmp-mcp."
      - "[4] For a user: the user logs in to the CMP (OIDC code + PKCE). [5] The user's request reaches the agent with the user's token."
      - "Then [1] again, as a token exchange (grant_type token-exchange, subject_token = the user's token, audience ai-gateway): sub stays the user, azp is the agent, scope never wider. Then [2] and [3]."
  - id: card-background
    title: "Background · provisioning an agent"
    color: amber
    lines:
      - "[A] When a project adds an agent, the CMP creates its Keycloak client through the Admin API, authenticated as the cmp-provisioner client (P2)."
      - "[B] The CMP writes the client secret in Vault at kvv2/projects/<p>/agents/<name>."
      - "[C] The secrets operator reads it [D] and writes the Secret agent-oidc in the agent's namespace."
  - id: card-objects
    title: "Objects · who points at whom"
    color: sky
    lines:
      - "Client agent → its service account user (group project-<p>-agents) → client scope project → project claim."
      - "Audience mapper → client ai-gateway; exchange-guard governs the agent clients; token lifespan sets exp."
      - "Secret agent-oidc → the agent pod's environment, in phase 1 only."
      - "Client scope cmp-tools (optional, opt-in per agent) → client cmp-mcp through its audience mapper."
  - {id: card-legend, title: Legend, color: slate, legend: true}
