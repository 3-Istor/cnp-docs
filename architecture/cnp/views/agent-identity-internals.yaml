apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · AI landing zone · Agent identity internals"
subtitle: "Who is an agent for the platform, how does it get a token, and how does it act on behalf of a user?"
meta:
  - "Scope: Keycloak realm 3istor with one client per hosted agent and standard token exchange (Keycloak 26.2+), proposal of 2026-10-25 · drawn in full: what the proposal adds (IA-1, IA-2) · faded: what already runs"
  - "Out of scope: how the gateway uses the claims (AI gateway internals) · OPA rules on claims (IA-3) · SPIFFE workload identity, a later option"
  - "Assumed: the CMP provisions agent clients through the Admin API; secrets go through Vault and VSO; no mTLS-bound tokens (CVE-2026-97846 affects exchange with them)"
  - "v0.2 · source: cnp-docs/architecture/cnp · keycloak.org (token exchange, 26.2 announcement)"

