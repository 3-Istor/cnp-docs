apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · Repo import · S8 Import by an AI agent"
subtitle: "What may an assistant do with the import tools, and where does the user have to step in?"
meta:
  - "Scope: S8 of the import design, planned (CNP-243) · MCP connection and token as in agent-connect · design spec v2 (2026-11-13)"
  - "The assistant acts with its user's rights; import and link need the user's confirmation; Apply is never autonomous."
  - "v0.1 · source: cnp-docs/architecture/cnp"

participants: [user, assistant-remote, cf-edge, envoy-shared-gateway, cmp-mcp, im-import, im-analyzer, im-wizard]

steps:
  - {id: c1, from: assistant-remote, to: cf-edge, over: c-assistant-edge, text: "tools/call analyze_repo {project, repo, branch} · Bearer"}
  - {note: cf-edge, text: "platform tunnel and Envoy, as in agent-connect"}
  - {id: f1, from: envoy-shared-gateway, to: cmp-mcp, over: c-envoy-cmp-mcp, text: "POST /mcp"}
  - {note: cmp-mcp, text: "stake policy: analyze is a read, allowed"}
  - {id: a1, from: cmp-mcp, to: im-import, over: c-im-mcp-import, text: "analyze with the user's rights"}
  - {id: a2, from: im-import, to: im-analyzer, over: c-im-import-analyzer, text: "analyze(repo, SHA)"}
  - {reply: a2, text: "ImportPlan"}
  - {reply: a1, text: "draft id, plan summary"}
  - {reply: f1}
  - {reply: c1, text: "7 services, 4 backing, 1 unsupported"}
  - {id: c2, from: assistant-remote, to: cf-edge, over: c-assistant-edge, text: "tools/call import_repo {draft}"}
  - {id: f2, from: envoy-shared-gateway, to: cmp-mcp, over: c-envoy-cmp-mcp, text: "POST /mcp"}
  - {note: cmp-mcp, text: "import: ask on every stake level · apply: never by an assistant"}
  - {reply: f2, text: "needs_user_confirmation · link to the draft"}
  - {reply: c2}
  - {note: assistant-remote, text: "asks the user in plain words, shares the link"}
  - {id: open, from: user, to: im-wizard, over: c-im-user-wizard, text: "opens the draft, reviews the canvas"}
  - {id: apply, from: user, to: im-import, over: c-im-user-import, text: "Apply · passkey step-up (import-apply)"}
  - {note: im-import, text: "audit_events: actor = user, via = assistant"}
