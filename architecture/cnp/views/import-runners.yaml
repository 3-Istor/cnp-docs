apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Repo import · Where jobs run"
subtitle: "Where do import builds and private-repo CI run, and what can an import job reach?"
meta:
  - "Scope: GitHub Actions runners of org 3-Istor as of 2026-11-14 · the import workflow in extern-project-analyzer, the CI of private repos"
  - "Sources: Cloud terraform/openstack/projects/epimac (runner.tf, cnp-import-runner/) · cnp-dev-runners runners, README · extern-project-analyzer .github/workflows/import.yml · K3s arcl-cmp/cmp-values.yaml"
  - "Out of scope: the CMP side of the callback (view import-callback) · GitHub-hosted runners, still used by public repos · the GitLab runner on the same VM"
  - "v0.1 · source: cnp-docs/architecture/cnp"

