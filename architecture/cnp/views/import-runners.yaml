cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · one import job on the VM"
    color: emerald
    lines:
      - "[1] cnp-import-runner signs a JWT with the key of GitHub App cnp-import-runners-3istor (self-hosted runners: write only) and asks for a JIT runner config."
      - "[2] A new runner container takes exactly one job of the import workflow, on a /24 network of its own."
      - "[3] It builds through its own rootless BuildKit (CNP_IMPORT_BUILDKIT_ENDPOINT), [4] which pulls docker.io base images from mirror.gcr.io."
      - "[5] Job publish pushes ghcr.io/3-istor/imports/<p>/<app> by digest, [6] then calls the CMP worker API with a GitHub OIDC JWT (view import-callback)."
      - "The runner, its BuildKit and the network are deleted when the job ends. The firewall drops any packet from 10.250.0.0/16 to private ranges, the metadata service and the host."
  - id: card-bg
    title: "Background · CI and test periods"
    color: violet
    lines:
      - "[A] epimac-github-runner, registered on the org, runs the CI of every private repo: GitHub Free gives private repos no hosted minutes left. [B] [C] Its Docker pulls Docker Hub images through a local cache of mirror.gcr.io."
      - "[D] to [I] cnp-dev-runners: an org owner runs ./runners up on a PC with Docker, 6 CI and 2 import runners by default, each for one job, until Ctrl-C."
      - "Private repos pick their runner with the repo variable CNP_CI_RUNS_ON: org variables do not reach private repos on the Free plan. Templates default to self-hosted, Linux, X64."
  - id: card-risk
    title: "What isolates an import job"
    color: rose
    lines:
      - "**On the VM:** one job per runner, its own BuildKit and network, egress firewall, no Docker socket. The workflow asks for label cnp-import-ephemeral, which the persistent runner lacks."
      - "**On a dev PC:** one job per runner, but a shared privileged BuildKit and no egress filter. For test periods, on code the team trusts."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    lines:
      - "!!G3!! **Transport.** TLS ends at Cloudflare. In-cluster hops are plain HTTP (view import-callback)."

