apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Anatomy of a project"
subtitle: "What does the platform create for one project, on its target cluster and around it?"
meta:
  - "Scope: one project <p> with its apps · target cluster drawn once, on-prem or public cloud alike · main as of 2026-10-29"
  - "Sources: cnp-project-base/templates · K3s/k8s/config/argocd/applicationset-{projects,apps}.yaml · app-templates/templates/{project-bootstrap,k3s-gitops-app} · CMP services/{project_registry,metrics_isolation}.py"
  - "Out of scope: inside an app (see app-runtime) · how the project is created, in order (see project-create-cloud) · platform-wide services not owned by the project"
  - "v0.1 · source: cnp-docs/architecture/cnp"

