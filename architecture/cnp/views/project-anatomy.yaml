  - z-internet
  - user
  - z-cloudflare
  - pa-cf
  - z-pa-target
  - g-pa-system
  - pa-tunnel
  - pa-gateway
  - pa-gatus
  - pa-offhours
  - pa-isolation
  - g-pa-apps
  - pa-app
  - pa-kube-api
  - z-cluster
  - g-gitops
