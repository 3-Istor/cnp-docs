steps: [c-pa-user-cf, c-pa-tunnel-gw, c-pa-gw-app]
background: [c-pa-tunnel-cf, c-pa-argocd-registry, c-pa-argocd-repos, c-pa-argocd-target]

cards:
  - id: card-legend
    title: "Legend"
    color: slate
    lines:
      - "Solid grey: a request, client → server. Dashed orange: tunnel opened outbound. Dashed purple: background sync."
      - "Dotted grey: an object reference (owns, bounds, datasource), not traffic."
      - "Large dashed frame: cluster or SaaS. Small frame: namespace or functional group. Stack: one per app."
      - "[1] request step · [A] background step · TCP 80: listening port on the server."
  - id: card-steps
    title: "Request path · data plane"
    color: emerald
    lines:
      - "[1] A user opens <app>-<p>.3istor.com: the project's Cloudflare tunnel ends TLS."
      - "[2] The project connector relays the request to the project gateway."
      - "[3] The gateway runs the OIDC login of the route, then sends the request to the app."
  - id: card-bg
    title: "Background"
    color: orange
    lines:
      - "[A] <p>-tunnel opens the tunnel outbound: nothing enters the cluster from the Internet."
      - "[B] Argo CD polls the registry record and generates the project's Applications. [C] It reads each app's values from its repo."
      - "[D] Argo CD applies <p>-bootstrap and every app Application to the target cluster API: destination.name = spec.targetCloud (on-prem: https://kubernetes.default.svc; clouds: the cluster-<cloud> Secret)."
  - id: card-made
    title: "Who creates what"
    color: indigo
    lines:
      - "**CMP:** the registry record (targetCloud, apps, environments, features) and the vmauth user project-<p>."
      - "**Terraform project-bootstrap** (in the CMP pod): Keycloak groups and realm <p>, Vault mount project-<p> with its role on kubernetes (on-prem) or kubernetes-<cloud>, the Cloudflare tunnel and DNS, the Grafana org."
      - "**Terraform k3s-gitops-app**, per app: the app repo, its OIDC client in realm <p>, its Vault secrets and role, its DNS record."
      - "**cnp-project-base**, by Argo CD: everything in <p>-system, the app namespaces and the ingress policy. Tenants cannot edit the policy (AppProject blacklist)."
  - id: card-access
    title: "Who sees what"
    color: rose
    lines:
      - "**Argo CD:** project-<p>-admins and -members get the project roles of AppProject <p>; <p>-platform holds what tenants cannot touch."
      - "**Apps:** realm <p> brokers the 3istor login; an app can be limited to groups with ingress.allowedGroups (empty by default)."
      - "**Data:** Grafana org <p> reads metrics through vmauth (its namespaces only) and logs from Loki tenant <p>."
