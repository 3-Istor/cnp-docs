title: "CNP · Observability · Target: full VictoriaMetrics"
subtitle: "What replaces Loki, Alloy and the VictoriaMetrics cluster, who writes and reads each signal, and how an alert reaches Discord?"
meta:
  - "Scope: on-prem hub, write path of metrics, logs and traces, reads by projects and platform, the single alert chain, backups and the AI audit record · proposal of 2026-11-13 (CNP-185, waves V1 to V6)"
  - "Out of scope: public clouds (same collectors, through the WireGuard relays), NetworkPolicies (one per store, D8), Gatus and OpenCost internals, dashboards"
  - "v0.1 (2026-11-13, proposal) · source: cnp-docs/architecture/cnp · current stack: views observability and observability-read"
