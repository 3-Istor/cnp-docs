cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · a failing app becomes a Discord message"
    color: emerald
    lines:
      - "[1] vmagent scrapes Envoy, kubelet, kube-state-metrics and annotated pods every 30 s, and forces the namespace label."
      - "[2] It remote_writes to VMSingle :8428: 30 days, under 150k series after the diet."
      - "[3] vmalert evaluates platform rules and the VMRules the CMP writes per project, each group pinned to the project's namespaces."
      - "[4] It sends firing alerts to Alertmanager :9093, which groups them and picks the app webhook, else the project's, else the platform's."
      - "[5] One Discord message per group: value, runbook, portal link, @here when critical."
  - id: card-bg
    title: "Background"
    color: orange
    lines:
      - "[A] [B] vlagent tails pod logs and the k3s audit.log, and inserts into VictoriaLogs :9428 (30 days, disk cap)."
      - "[C] [D] [E] [F] Template apps expose /metrics and send OTLP spans; the AI landing zone sends GenAI spans. The collector matches the pod from the connection, strips client k8s.* attributes and PII, and exports to VictoriaTraces."
      - "[G] to [N] Reads: project Grafana orgs go through vmauth (one user per project, read paths only, filters forced). Org 1, the CMP and Argo Rollouts read the stores directly, behind NetworkPolicies, so a vmauth outage never aborts a canary."
      - "[O] vmalert runs log rules on VictoriaLogs. [P] [Q] The CMP mutes alerts (project matcher forced) and posts its own events in the same format."
      - "[R] [S] A Watchdog alert pings the dead man's switch every 5 min; silence for 15 min means the alert chain is down."
      - "[T] vmbackup copies metrics to Ceph RGW daily. [U] [V] audit-record reads each finished agent run, signs it with Vault transit, and puts it under Object Lock for 180 days."
  - id: card-replaces
    title: "What goes away"
    color: rose
    lines:
      - "**Alloy** (1.8 GiB on two nodes) → vmagent + vlagent."
      - "**Loki** + nginx gateway + per-project tenants → VictoriaLogs + vmauth filters."
      - "**VM cluster** (vminsert, vmselect, vmstorage) → VMSingle; the old Service names stay as aliases, so rollback is a selector flip."
      - "**Grafana-managed project alerts**, the Loki ruler → vmalert. Custom Grafana rules of projects stay."
      - "Tempo, planned by the AI landing zone, is not installed: it stays the fallback for VictoriaTraces (pre-1.0)."
