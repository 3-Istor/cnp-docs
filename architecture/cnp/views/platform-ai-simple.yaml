apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · La landing zone IA en un coup d'œil"
subtitle: "Tout le trafic des agents passe par la gateway : identité, policy et trace"
meta:
  - "Périmètre : hub K3s on-prem, option B du 2026-10-23 (agentgateway + kagent) · en clair : ce que la landing zone IA ajoute · estompé : ce qui tourne déjà"
  - "Une boîte par brique ; le détail de chaque brique est dans platform-ai-stack et les vues zoom"
  - "v1.0 · source : cnp-docs/architecture/cnp"

