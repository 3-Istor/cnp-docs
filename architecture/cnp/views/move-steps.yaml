apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Project move · Steps"
subtitle: "Which steps of a move do users feel, and for how long?"
meta:
  - "Scope: the 8 steps of the CMP move engine, durations measured after CNP-292 (CMP v0.3.140, moves 9 and 10 on todo-move) · main as of 2026-11-22"
  - "Out of scope: failures, retry and cancel (a move can only be cancelled before stop_source) · components in move-components"
  - "v0.1 · source: cnp-docs/architecture/cnp · journals CNP-291 and CNP-292"

include:
  - mv-z-steps-a
  - mv-z-steps-b
  - mv-z-steps-c
  - mv-s-prepare
  - mv-s-stop
  - mv-s-backup
  - mv-s-switch
  - mv-s-wait
  - mv-s-persist
  - mv-s-cleanup
  - mv-s-finish

notes:
  - id: n-cut-start
    text: "!!CUT STARTS!!: the apps stop serving."
  - id: n-cut-end
    text: "!!CUT ENDS!!: at cleanup_source. Until then Cloudflare still sends part of the requests to the stopped source."

cards:
  - id: card-cut
    title: "The cut, before and after the optimisation"
    color: emerald
    lines:
      - "**User-visible cut** (stop_source to cleanup_source start)"
      - "To on-prem: 6m31 / 7m36 before, **5m59** after"
      - "To AWS: 4m50 before, **4m35** after"
      - "**Engine cut** (stop_source to target healthy)"
      - "To on-prem: 5m57 / 6m46 before, **5m09** after"
      - "To AWS: about 4m00 before, **3m44** after"
      - "**Switch commit to first pod on the target**"
      - "To on-prem: about 2m30 before, **63 s** after"
      - "To AWS: 1m38 before, **55 s** after"
      - "Target setup and image pulls moved into prepare, before the cut: 35 to 51 s before, now 3m44 to on-prem, 2m17 to AWS, not felt by users."
  - id: card-wait
    title: "Inside wait_target, move 10 (to on-prem, 4m35)"
    color: sky
    lines:
      - "Observed on Argo CD events and pods, not engine sub-steps."
      - "Argo CD sync starts: 25 s after the switch commit"
      - "First pod: +38 s"
      - "DB restore starts: +25 s"
      - "DB restore and DB ready: 85 s"
      - "Migration: 66 s"
      - "Backend ready, CMP detects healthy: 37 s"
  - id: card-rpo
    title: "RPO 0 in every move"
    color: violet
    lines:
      - "A test check, not an engine step: measured on the test app."
      - "md5 of the todo table on the source at stop equals the md5 on the target after the restore."
      - "Equal in all five moves (6 to 10)."
      - "The final backup is taken once the apps are at 0, so nothing writes after it."
