notes:
  - {id: n-vault, text: "Clouds and the operator reach Vault at **vault.3istor.com :443**, public, through Cloudflare and the platform tunnel. Vault listens on 8200 behind it."}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-bg
    title: "Background · control plane"
    color: orange
    lines:
      - "[A] [B] Argo CD syncs the EKS / GKE API (:443) with the argocd-manager token."
      - "[C] [D] The cloud secret operator logs in at auth/kubernetes-aws / -gcp on vault.3istor.com :443 (public, through Cloudflare)."
      - "[E] [F] The on-prem WireGuard pods initiate UDP 31820 to the cloud node (NodePort, pod 51820)."
      - "[G] [H] Vault checks service-account tokens with TokenReview (SA vault-auth, auth-delegator). [I] The hub secret operator reads Vault."
      - "[J] [K] Terraform (cluster-addons) calls the cloud API. [L] It writes the cluster entry kvv2/argocd/clusters/<cloud> and the auth config into Vault."
      - "[M] It publishes <node IP>:31820 in the endpoint bucket. [N] The on-prem pod re-reads it every ~60 s when the last handshake is older than 180 s."
      - "[O] [P] [Q] The EKS kubeconfig in SSM, and the Terraform state in S3 and GCS."
      - "[R] Argo CD polls cnp-projects. [S] The CMP writes the registry record. [T] [U] Image Updater reads GHCR tags and writes back to Git. [V] [W] Cloud nodes pull images from GHCR."
      - "[X] [Y] [Z] Project tunnels to Cloudflare: see multicloud."
  - id: card-allow
    title: "Who allows it"
    color: rose
    lines:
      - "**Cloud API :443**: only api_allowed_cidrs, which include the K3s egress 176.186.130.237/32 (dotted arrows). EKS: API access entry for the operator only."
      - "**UDP 31820**: EKS security group and GKE firewall, only from vpn_source_cidrs (the K3s egress)."
      - "**Vault**: a Kubernetes auth mount per cloud (kubernetes-aws, kubernetes-gcp), kept across down."
      - "**Inbound to workloads**: none. No LoadBalancer exists (cnp.sh down aborts if one does); apps are reached only through outbound Cloudflare tunnels."
  - id: card-tunnel
    title: "What crosses the tunnel and what does not"
    color: amber
    lines:
      - "Declared TCP relays only: on-prem :18081 to the cloud whoami (vpn-test:80) and cloud :18080 to the on-prem whoami."
      - "Today only test flows use the tunnel. Argo CD [A] [B], Vault [C] [D] [G] [H] and app traffic go over the public Internet, limited by the allow-lists."
      - "Tunnels: 100.96.0.0/30 (AWS .1, on-prem .2) and 100.96.0.4/30 (GCP .5, on-prem .6)."
  - id: card-gaps
    title: "Gaps between the plan and the code"
    color: orange
    lines:
      - "!!G13!! **Secret operator.** Ricoberger operator on hub and clouds: behaviour during a Vault outage is untested."
      - "!!G18!! **Sync after a long down.** Argo CD keeps retrying against the destroyed cluster's address (CNP-112)."
