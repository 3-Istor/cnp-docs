notes:
  - {id: n-vault, text: "Clouds and the operator reach Vault at **vault.3istor.com :443**, public, through Cloudflare and the platform tunnel. Vault listens on 8200 behind it."}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-bg
    title: "Background · control plane"
    color: orange
    lines:
      - "[A] Argo CD syncs the cloud API (:443) with the argocd-manager token. CNP-112: cloud Applications retry forever."
      - "[B] The cloud secret operator logs in at auth/kubernetes-<cloud> (kubernetes-aws, kubernetes-gcp) on vault.3istor.com :443, with vault-secrets-operator-role and, for Alloy's Loki password, observability-role."
      - "[C] The on-prem WireGuard pod (one per cloud) initiates UDP 31820 to the cloud node (NodePort, pod 51820)."
      - "[D] Vault checks service-account tokens with TokenReview (SA vault-auth, auth-delegator). [E] The hub secret operator reads Vault."
      - "[R] The operator opens ssh -D 1080 to pae-node-1. [F] Terraform and kubectl reach the cloud API through that SOCKS proxy, so the API sees the on-prem egress IP."
      - "[G] Terraform writes the cluster entry kvv2/argocd/clusters/<cloud> and the auth config into Vault. [H] It publishes <node IP>:31820 in the endpoint bucket (on AWS, for both clouds). [I] The on-prem pod re-reads it when the last handshake is older than 180 s."
      - "[J] [K] [L] Provider-specific: the EKS kubeconfig in SSM and its state in S3; the GKE state in GCS."
      - "[M] Argo CD polls cnp-projects. [N] The CMP writes the registry record. [O] [P] Image Updater reads GHCR tags and writes back to Git. [Q] Cloud nodes pull images from GHCR."
      - "[S] The CMP reads pods, rollouts, scans and backups of cloud projects, with the token of the Argo CD Secret cluster-<cloud>. It refuses to call unless the cluster state is up."
  - id: card-allow
    title: "Who allows it"
    color: rose
    lines:
      - "**Cloud API :443**: only api_allowed_cidrs = the K3s egress 176.186.130.237/32, set as EKS public_access_cidrs and GKE master authorized networks. The operator gets there through pae-node-1, Argo CD and the CMP from the K3s pods. EKS: API access entry for the operator only."
      - "**UDP 31820**: security group (EKS) or firewall (GKE), only from vpn_source_cidrs (the K3s egress)."
      - "**Relays 18080 / 18082 / 18083**: NetworkPolicy onprem-apps in cnp-vpn on each cloud; on-prem, the VictoriaMetrics policies admit the wireguard pods. See multicloud-policies."
      - "**Vault**: a Kubernetes auth mount per cloud (kubernetes-aws, kubernetes-gcp), kept across down."
      - "**Inbound to workloads**: none. Guardrails refuse LoadBalancer Services and Ingress; apps are reached only through outbound Cloudflare tunnels."
  - id: card-tunnel
    title: "What crosses the tunnel"
    color: amber
    lines:
      - "**Cloud to on-prem, declared TCP relays only** (socat at each end): :18080 to vminsert :8480 (metrics), :18082 to loki-gateway :80 (logs), :18083 to vmselect :8481 (canary analysis)."
      - "Clients: Alloy (ns observability) writes 18080 and 18082 with label cluster=aws|gcp; Argo Rollouts reads 18083."
      - "On-prem to cloud: :18081 to the cloud whoami, test only."
      - "Not through the tunnel: the CMP reads vmselect :8481 and the Loki gateway :80 directly, inside the hub."
      - "Argo CD [A], Vault [B] [D], the CMP [S] and app traffic stay on the public Internet, limited by the allow-lists."
      - "One tunnel per cloud: 100.96.0.0/30 (AWS .1, on-prem .2), 100.96.0.4/30 (GCP .5, on-prem .6)."
  - id: card-gaps
    title: "Gaps between the plan and the code"
    color: orange
    lines:
      - "!!G13!! **Secret operator.** Ricoberger operator on hub and clouds: behaviour during a Vault outage is untested."
      - "!!G18!! **Delete during a down.** Cloud Applications retry forever with refresh (CNP-112); deleting one while its cluster is down hangs on the finalizer."
      - "!!G7!! **CMP API auth.** The backend verifies signature, issuer and expiry and the edge checks JWTs; the audience is still not checked."
      - "**CMP egress.** No proxy in kube_client: the CMP pod relies on the K3s node egress being 176.186.130.237. Inferred, not in code."
      - "!!GO1!! **Relay auth.** vminsert takes the writes with no credential: the cluster label is set by the client."
      - "!!GO2!! **Loki gateway.** No NetworkPolicy in front of it: basic auth is the only check."
