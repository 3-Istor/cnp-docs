apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Multicloud · Links between the hub and the clouds"
subtitle: "Which links cross between the on-prem hub and the public clouds, who opens them, and what allows them?"
meta:
  - "Scope: every connection between the K3s hub, the public cloud target (drawn once for EKS cnp-eks and GKE cnp-gke: same links), the buckets, GitHub and the operator · main as of 2026-10-29 · derived from code: K3s/k8s/config/{wireguard,argocd,observability}, K3s/terraform/{roles.tf,policies}, Cloud/terraform/public/{aws/EKS,gcp/GKE}/{cnp.sh,main.tf,kubernetes}, platform/{observability,argo-rollouts}, CMP/backend/app/services/kube_client.py"
  - "Out of scope: projects, apps and their tunnels to Cloudflare (see multicloud) · tenants of the hub · what observability does with the data (see observability)"
  - "v0.4 (2026-10-29: EKS and GKE drawn as one public cloud target) · source: cnp-docs/architecture/cnp"

