cards:
  - id: card-legend
    title: "How to read"
    color: slate
    lines:
      - "**Green**: where the apps run, or a service of the platform."
      - "**Violet**: where the data is kept."
      - "**Cyan**: what people open (Grafana, the CMP portal)."
      - "**Grey**: outside the platform, or a tool."
      - "Arrows point from who asks to who answers."
  - id: card-read
    title: "In short"
    color: emerald
    lines:
      - "Every cluster runs Alloy. The public clouds (AWS and GCP, same setup) send through the WireGuard tunnels to the on-prem stores."
      - "Each project sees only its own metrics and logs in Grafana and in the CMP."
      - "Alerts go to Discord, from Grafana, the alert rules and the CMP. Costs are read from the same metrics (OpenCost, on-prem today)."
