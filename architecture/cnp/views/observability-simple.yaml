apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Observability · At a glance"
subtitle: "Where do the metrics and logs of every cluster go, and who reads them?"
meta:
  - "Scope: the three clusters, the on-prem stores and their readers, names only · main as of 2026-10-29 · detail: observability and observability-read"
  - "Out of scope: protocols, ports, credentials · OpenCost on the clouds (later)"
  - "v0.2 · source: cnp-docs/architecture/cnp"

