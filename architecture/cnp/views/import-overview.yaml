notes:
  - {id: n-portal, text: "**The user installs CNP-Portal here,** on the repos they pick. The CMP only mints tokens for contents:read, metadata:read and one repo."}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · Apply (S4)"
    color: emerald
    lines:
      - "[1] An admin or owner applies the draft; the CMP asks for a passkey step-up first."
      - "[2] The import module writes the import rows and dispatches the build workflow with ids and the SHA only."
      - "[3] Job prepare trades its GitHub OIDC JWT with the CMP, [4] which mints a CNP-Portal token down-scoped to contents:read and the one repo. The key never leaves the CMP."
      - "[5] Job prepare downloads the tarball at that SHA, runs gitleaks and trivy fs. No user code runs with a secret."
      - "Job build has no secret and no id-token: buildx, Trivy image, Syft SBOM."
      - "[6] Job publish pushes ghcr.io/3-istor/imports/<p>/<app> by digest, [7] then calls the CMP back with its GitHub OIDC JWT."
      - "[8] One Git Data commit writes values, digests and dependsOn to the registry, as CNP-Portal. An app enters spec.apps with its first digest."
      - "[9] The ApplicationSet picks the record up and creates the Applications, [10] which render infra-templates with $values from cnp-projects, [11] and apply the workloads."
      - "[12] The kubelet pulls the image by digest with the project pull credential. [13] The CMP reads Application health, [14] then runs a smoke check (the project policy lets arcl-cmp in)."
  - id: card-bg
    title: "Background · linking, analysis, rebuild"
    color: violet
    lines:
      - "[A] The user installs CNP-Portal on chosen repos; the CMP proves it with the OAuth user token and GET /user/installations, over the same connection as [4] (S1)."
      - "[B] Analysis (S3): [C] the analyzer downloads a size-capped tarball at the SHA with a down-scoped token; it parses compose, Dockerfiles, poms and nginx, and executes nothing."
      - "[D] GitHub push webhook from CNP-Portal (HMAC) starts a rebuild; at wake-up the CMP compares each tracked branch HEAD (S5)."
      - "[E] A Terraform run in the CMP pod writes the backing apps' generated credentials to Vault kvv2 project-<p>/<app>, after the build passed. [F] The CMP already reads VictoriaMetrics; the Topology tab adds observed flows (view topology-data)."
      - "[G] The wizard and the draft canvas. [H] An imported service reaches its backing app through a dependsOn alias."
  - id: card-trust
    title: "Who touches the user's code"
    color: rose
    lines:
      - "**Read only, short lived.** Tokens minted from CNP-Portal for a user installation carry contents:read, metadata:read and one repo, for 1 hour. The key stays in the CMP."
      - "**Accepted residual risk.** The installation itself holds every CNP-Portal permission the user granted (GI1)."
      - "**Argo CD never reads a user repo.** It reads cnp-projects and infra-templates; images come by digest from GHCR."
      - "**The user repo stays the source of truth.** CNP writes nothing to it: no deploy/values, no Image Updater."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    lines:
      - "!!GI1!! **CNP-Portal on user accounts.** Accepted on 2026-11-13. Today the CMP mints full-permission tokens; user installations must get down-scoped ones."
      - "!!GI2!! **Step-up is off.** STEP_UP_ENABLED defaults to false: Apply would run on a plain session."
      - "!!GI4!! **AppProject trusts every repoURL.** sourceRepos lists each spec.apps[].repoURL: an imported app must carry source, not repoURL."
      - "**Registry writes.** Today one Contents API PUT per change; the design moves to one Git Data API commit per apply or callback."

