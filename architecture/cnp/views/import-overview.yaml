  - "Scope: importing a GitHub repo into an existing project, on-prem · hatched = planned (CNP-158 and its tickets), the rest exists on main as of 2026-11-13"
  - "Sources: import design spec v2 (2026-11-13) · CMP services/{github_service,project_registry,step_up,authz}.py, mcp_server.py · K3s applicationset-apps.yaml · cnp-project-base templates/{app-project,network-policy}.yaml · infra-templates"
  - "Out of scope: the order of each flow (sequences import-link-github, import-analyze, import-apply, import-rebuild, app-link, import-agent) · inside an imported app (import-epitweet) · Cloudflare, tunnel and Envoy hops to the CMP"
