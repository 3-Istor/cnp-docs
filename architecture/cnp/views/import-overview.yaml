notes:
  - {id: n-portal, text: "**CNP-Portal never leaves org 3-Istor.** It holds near-admin org rights; users install CNP-Import, read-only, on the repos they pick."}
  - {id: n-gitlab, text: "GitLab path: same jobs, the prepare job gets a short GitLab token from the CMP against its OIDC JWT."}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · Apply (S4)"
    color: emerald
    lines:
      - "[1] An admin or owner applies the draft; the CMP asks for a passkey step-up first."
      - "[2] The import module writes the import rows and dispatches the build workflow with ids and the SHA only."
      - "[3] Job prepare mints a CNP-Import token for the one repo, [4] downloads the tarball at that SHA, runs gitleaks and trivy fs. No user code runs with a secret."
      - "Job build has no secret and no id-token: buildx, Trivy image, Syft SBOM."
      - "[5] Job publish pushes ghcr.io/3-istor/imports/<p>/<app> by digest, [6] then calls the CMP back with its GitHub OIDC JWT."
      - "[7] One Git Data commit writes values, digests and dependsOn to the registry, as CNP-Portal. An app enters spec.apps with its first digest."
      - "[8] The ApplicationSet picks the record up and creates the Applications, [9] which render infra-templates with $values from cnp-projects, [10] and apply the workloads."
      - "[11] The kubelet pulls the image by digest with the project pull credential. [12] The CMP reads Application health, [13] then runs a smoke check (the project policy lets arcl-cmp in)."
  - id: card-bg
    title: "Background · linking, analysis, rebuild"
    color: violet
    lines:
      - "[A] The user installs CNP-Import on chosen repos; [C] the CMP proves it with the OAuth user token and GET /user/installations (S1)."
      - "[B] GitLab: OAuth with PKCE, [D] tokens kept encrypted (S2)."
      - "[E] Analysis (S3): [F] the analyzer downloads a size-capped tarball at the SHA, [G] or the GitLab archive; it parses compose, Dockerfiles, poms and nginx, and executes nothing."
      - "[H] GitHub push webhook (HMAC), [I] GitLab polling every 5 min: both start a rebuild (S5)."
      - "[J] A Terraform run in the CMP pod writes the backing apps' generated credentials to Vault kvv2 project-<p>/<app>, after the build passed. [M] The CMP already reads VictoriaMetrics; the Topology tab adds observed flows (view topology-data)."
      - "[K] GitLab builds: job prepare trades its OIDC JWT for a short GitLab token, [L] then downloads the archive. [N] The wizard and the draft canvas. [O] An imported service reaches its backing app through a dependsOn alias."
  - id: card-trust
    title: "Who touches the user's code"
    color: rose
    lines:
      - "**Read only, short lived.** CNP-Import (contents:read, metadata:read) and GitLab OAuth (read_repository, read_api); tokens of 1 hour, scoped to one repo for a build."
      - "**Argo CD never reads a user repo.** It reads cnp-projects and infra-templates; images come by digest from GHCR."
      - "**The user repo stays the source of truth.** CNP writes nothing to it: no deploy/values, no Image Updater."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    lines:
      - "!!GI1!! **CNP-Portal on user accounts.** The CMP already sends users to install CNP-Portal on their own account (user_github_installations). The design forbids it."
      - "!!GI2!! **Step-up is off.** STEP_UP_ENABLED defaults to false: Apply would run on a plain session."
      - "!!GI4!! **AppProject trusts every repoURL.** sourceRepos lists each spec.apps[].repoURL: an imported app must carry source, not repoURL."
      - "**Registry writes.** Today one Contents API PUT per change; the design moves to one Git Data API commit per apply or callback."

