apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Project Topology · Where the data comes from"
subtitle: "Where does the project Topology view get its nodes and edges?"
meta:
  - "Scope: the Topology tab of one project, on-prem · in prod since 2026-11-14 (CNP-242) · hatched: Hubble Relay, later"
  - "Sources: import design spec v2 · K3s k8s/config/kube-system/values.yaml (Hubble), observability/{vmagent,vmagent-scrapes,fluent-bit,vmsingle}.yaml · CMP services/{kube_client,activity_sources}.py"
  - "Out of scope: linking two apps (sequence app-link) · public clouds (no Hubble metrics there yet) · Grafana"
  - "v0.2 (2026-11-21: vmagent and VMSingle, no Alloy) · source: cnp-docs/architecture/cnp"

