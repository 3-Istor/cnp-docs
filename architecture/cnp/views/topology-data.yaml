  - z-internet
  - tp-canvas
  - z-cluster
  - g-cmp
  - tp-api
  - g-gitops
  - argocd
  - g-ag-kapi
  - kube-apiserver
  - g-observability
  - g-vo-store
  - vo-vmsingle
  - g-vo-collect
  - vo-vlagent
  - vo-vmagent
  - tp-g-cilium
  - tp-hubble-relay
  - tp-hubble-metrics
  - tp-hubble-export
  - z-github
  - pa-registry

steps: [c-tp-canvas-api, c-tp-api-registry, c-tp-api-kapi, c-tp-api-vmsingle]
background: [c-pa-argocd-registry, c-argocd-apiserver, c-tp-vmagent-hubble, c-vo-vmagent-vmsingle, c-tp-fluentbit-export]

labels:
  r-tp-relay-metrics: ""
  c-vo-vmagent-vmsingle: ""
  c-tp-api-vmsingle: ""
  c-tp-canvas-api: ""
  c-argocd-apiserver: ""
  c-tp-api-kapi: ""

notes:
  - {id: n-offhours, text: "offhours-guard writes each OffhoursSchedule's status.currentState (asleep, awake) through the same API: the node card shows it."}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · reading the Topology"
    color: emerald
    lines:
      - "[1] The tab asks the CMP for the project's topology; the user needs member or above."
      - "[2] **Nodes and declared edges.** The registry record lists the apps and their dependsOn links."
      - "[3] **Node state.** Application health and sync from Argo CD, offhours state from the OffhoursSchedule, both read through the API."
      - "[4] **Observed edges.** Flow counters by source and destination workload and verdict, over the last minutes, from VMSingle."
  - id: card-bg
    title: "Background"
    color: violet
    lines:
      - "[A] Argo CD polls the registry and [B] applies, then writes Application health."
      - "[C] vmagent scrapes the Hubble flow metrics on each cilium-agent (:9965) and [D] remote-writes them to VMSingle."
      - "[E] Dropped flows also leave Cilium as logs: Fluent Bit sends them to VictoriaLogs, where POLICY_DENIED lines can be searched."
  - id: card-edges
    title: "Edge states on the canvas"
    color: indigo
    lines:
      - "**Declared and observed:** solid. **Declared only:** dashed grey."
      - "**Observed only:** amber, with a 'declare this link' action."
      - "**Denied:** red, from flows with verdict DROPPED."
      - "Hubble Relay (later) feeds a drawer of live flows for one edge; the canvas never depends on it."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    lines:
      - "**Live flows.** Hubble metrics are scraped by vmagent; the drawer of live flows through Hubble Relay is still to build."

