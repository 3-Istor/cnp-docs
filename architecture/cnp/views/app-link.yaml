apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · Project Topology · S6 Linking two apps"
subtitle: "What happens when a user draws an edge between two apps on the Topology canvas, until the edge turns solid?"
meta:
  - "Scope: S6 of the import design, planned (CNP-240 links, CNP-242 topology) · template and imported apps alike · design spec v2 (2026-11-13)"
  - "The isolation: links mode (one ingress rule per dependsOn) comes later; until then the project policy already lets apps of a project talk."
  - "v0.1 · source: cnp-docs/architecture/cnp"

participants: [tp-canvas, tp-api, pa-registry, argocd, im-chart, kube-apiserver, vm-vmselect]

steps:
  - {note: tp-canvas, text: "user draws A → B, port 8081, alias user-service"}
  - {id: link, from: tp-canvas, to: tp-api, over: c-tp-canvas-api, text: "POST /api/projects/{p}/links {from, to, port, alias}"}
  - {note: tp-api, text: "admin or owner · both apps in p"}
  - {id: commit, from: tp-api, to: pa-registry, over: c-tp-api-registry, text: "commit dependsOn of A"}
  - {reply: link, text: "202 · edge declared (dashed)"}
  - {id: poll, from: argocd, to: pa-registry, over: c-pa-argocd-registry, text: "poll"}
  - {id: render, from: argocd, to: im-chart, over: c-im-argocd-chart, text: "render A: ExternalName user-service → B's Service"}
  - {id: sync, from: argocd, to: kube-apiserver, over: c-argocd-apiserver, text: "apply the alias in A's namespace"}
  - {note: kube-apiserver, text: "A calls B by its original hostname"}
  - {id: read, from: tp-canvas, to: tp-api, over: c-tp-canvas-api, text: "GET topology (refresh)"}
  - {id: obs, from: tp-api, to: vm-vmselect, over: c-tp-api-vmselect, text: "flows A → B by verdict"}
  - {reply: obs, text: "FORWARDED > 0"}
  - {reply: read, text: "edge declared and observed: solid"}
