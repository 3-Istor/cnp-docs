apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Project move · Components"
subtitle: "What takes part when a project moves between the on-prem cluster and a public cloud?"
meta:
  - "Scope: the CMP move engine, the registry, Argo CD, the source and target clusters, the database backup path, Vault and the tunnel · main as of 2026-11-22"
  - "Out of scope: ports, credentials, network policies, the order of steps (see move-steps)"
  - "v0.1 · source: cnp-docs/architecture/cnp"

