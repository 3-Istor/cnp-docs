cards:
  - id: card-legend
    title: "How to read"
    color: slate
    legend: true
  - id: card-read
    title: "In short"
    color: emerald
    lines:
      - "The CMP drives the move and commits the decision to the registry; Argo CD reads it and deploys."
      - "The CMP also acts on the clusters directly: check the Vault role, copy VaultSecrets, stop apps, final backup, commit the restore to the app repo, delete the source."
      - "The database goes through one S3 bucket on the on-prem Ceph: backup on the source, restore on the target."
      - "A cloud reaches the bucket through WireGuard, an on-prem cluster directly. One end is a cloud, or both."
      - "One tunnel, one connector per cluster: the target connector stays at 0 replicas until the switch."
