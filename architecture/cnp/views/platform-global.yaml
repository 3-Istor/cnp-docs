cards:
  - id: card-steps
    title: "Paths across the platform"
    color: emerald
    lines:
      - "[1]–[3] A user reaches an app: Cloudflare edge, the app's tunnel, then the shared Envoy gateway (zoom 1)."
      - "[4] [5] Apps and hosted agents call models only through the AI gateway, with a short Keycloak token (zooms 2, 4, 6)."
      - "[6] [7] The gateway calls Gemini's free tier; on 429, or for projects marked Local, it calls the GPU server over HTTPS on the local network (zoom 3)."
      - "[8] Tool calls go to the CMP's MCP server, which applies the stake policy (zoom 5)."
      - "[9]–[13] A release is a tag: GitHub, GHCR, Image Updater, then Argo CD applies it to the cluster (zoom 7)."
  - id: card-background
    title: "Background · control plane"
    color: amber
    lines:
      - "[A] [B] Vault and its operator deliver the Gemini key to the gateway only (zoom 6)."
      - "[C] [D] Keycloak issues one client per agent; the gateway caches its JWKS."
      - "[E] [F] WireGuard links the hub to the public cloud target (EKS and GKE, drawn once); Argo CD deploys there (zoom 10). Unlettered: the tunnel relays cloud metrics, logs and canary queries home (TCP 18080, 18082, 18083), and the CMP reads cloud projects on the cloud API."
      - "Observability (Alloy, Loki, Tempo, Grafana) is left out of this map to keep it readable: see the ai-gateway view and zoom 9."
  - id: card-plan
    title: "Order of work"
    color: sky
    lines:
      - "**P0** default-deny between tenants (G1), pods not root (G8), protected main (G17), CNPG backups (G2)."
      - "**IA-1** AI gateway, Gemini and GPU server backends, Tempo."
      - "**IA-2** sandboxed hosted agents, ToolHive MCP servers, guardrails (promptGuard, webhook, Llama Guard), A2A."
      - "**IA-3** OPA through extAuth once the CEL rules are not enough."
  - {id: card-legend, title: Legend, color: slate, legend: true}
