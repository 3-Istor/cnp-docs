apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · AI landing zone · Agent sandbox internals · gVisor tier"
subtitle: "How does an agent get an isolated place to run the code it writes, and what keeps that code away from the cluster?"
meta:
  - "Scope: kubernetes-sigs/agent-sandbox v1beta1 with gVisor on the on-prem K3s, proposal of 2026-10-23 · drawn in full: what the proposal adds (IA-2) · faded: what already runs"
  - "Out of scope: the agent's model and tool calls (AI gateway internals view) · the agent's identity (zoom 6) · Kata Containers, not available on OpenStack VMs without nested virtualisation"
  - "Assumed: one namespace of agents per project; the agent itself runs in a long-lived Sandbox and asks short-lived ones for code; warm pool of 1 gVisor sandbox limited to 512 Mi on the 4 GB budget, none for Kata"
  - "v0.1 · source: cnp-docs/architecture/cnp · agent-sandbox.sigs.k8s.io (API reference, Python client), github.com/kubernetes-sigs/agent-sandbox"

