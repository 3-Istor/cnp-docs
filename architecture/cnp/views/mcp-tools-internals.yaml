notes:
  - {id: n-th-two, text: "Two kinds of tool servers behind one /mcp: the CMP's own MCP server, which already applies the stake policy per project, and third-party servers run by ToolHive, each in its own pod with its own token."}
  - {id: n-th-names, text: "The MCP backend lists the tools of all its targets behind one /mcp endpoint, so the agent sees one tool server. How names are kept apart across targets is for the phase 2 trial to confirm."}
  - {id: n-th-stake, text: "Stake policy: allow runs at once, ask needs the user's yes, PR opens a pull request, approve waits for an approver in the CMP, deny refuses. The agent never decides its own stake."}

cards:
  - id: card-steps
    title: "Request path · an agent calls a tool"
    color: emerald
    lines:
      - "[1] The agent sends tools/call to /mcp on the AI gateway with its JWT; jwtAuthentication and authorization check it as for a model call."
      - "[2] The route match sends /mcp to the MCP proxy, which applies the AgentgatewayPolicy tools: CEL on the JWT claims and mcp.tool.name, allow only what matches."
      - "[3] For a GitHub tool such as issue_read, the MCP proxy calls the ToolHive proxy of that server."
      - "[4] The ToolHive proxy checks the JWT again (Keycloak issuer, audience), its Cedar policy and tool filter, then writes the JSON-RPC to the server's stdin."
      - "[5] github-mcp-server calls the GitHub API with its own token, never the agent's."
      - "[6] For CMP tools, the MCP proxy calls the CMP's MCP server, [7] which evaluates the stake policy and calls the CMP API, [8] which commits or tags in the app repo."
  - id: card-background
    title: "Background · control plane and identity"
    color: amber
    lines:
      - "[A] The ToolHive operator watches MCPServer and writes the proxy Deployment, Service, ServiceAccount and Role."
      - "[B] The agentgateway controller watches the mcp route, the mcp backend and the tools policy, and configures the MCP proxy."
      - "[C] The ToolHive proxy creates the server pod and attaches to its stdio through the API."
      - "[D] [E] The ToolHive proxy and jwtAuthentication fetch Keycloak's JWKS. [F] The agent gets its JWT from Keycloak. [G] Code runs go to sandboxes (sandbox zoom)."
  - id: card-objects
    title: "Objects · who points at whom"
    color: sky
    lines:
      - "HTTPRoute mcp → AgentgatewayBackend mcp → Service mcp-github-proxy (and the CMP's MCP service); AgentgatewayPolicy tools → the backend."
      - "MCPServer github → MCPToolConfig, MCPOIDCConfig, MCPTelemetryConfig, Secret github-token."
      - "Per MCPServer the operator generates a Deployment for the proxy, a Service and a ServiceAccount with its Role; the proxy creates the server pod."
      - "stdio servers run as one replica with one client: here the MCP proxy. Scale with streamable HTTP servers."
  - {id: card-legend, title: Legend, color: slate, legend: true}
