title: "CNP · AI landing zone · MCP tools internals"
subtitle: "How does an agent's tool call reach a tool server, and who checks it on the way?"
meta:
  - "Scope: Agent Router MCPRoute in front, ToolHive operator v1beta1 for third-party tool servers, the CMP's own MCP server, proposal of 2026-10-23 · drawn in full: what the proposal adds (IA-2) · faded: what already runs"
  - "Out of scope: model calls (AI gateway internals) · OPA ext_authz per tool (IA-3) · ToolHive vMCP, not needed while the MCPRoute aggregates"
  - "Assumed: example tool server github-mcp-server over stdio; one MCPRoute per gateway; tool tokens synced from Vault"
  - "v0.1 · source: cnp-docs/architecture/cnp · docs.stacklok.com/toolhive · theagentrouter.ai (MCP)"

