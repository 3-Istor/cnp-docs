notes:
  - {id: n-sb-node, text: "The node box is the K3s worker, itself a VM on an OpenStack server. Kata starts one more VM per sandbox inside it, so the server must expose its virtualisation to the node VM (nested virt), or the node must be bare metal."}
  - {id: n-sb-kata, text: "Each sandbox has its own guest kernel: a kernel exploit by the code stays inside a micro-VM. The price: about a hundred MB of RAM and a slower start per sandbox, plus nested virt, which OpenStack operators often leave off."}
  - {id: n-sb-warm, text: "Warm pool matters more here: a micro-VM takes longer to boot than a gVisor sandbox, so a claim should take one already running."}

cards:
  - id: card-steps
    title: "Request path · an agent runs code in a micro-VM"
    color: emerald
    lines:
      - "[1] [2] As in the gVisor tier: the agent creates a SandboxClaim, the extensions controller binds it to a warm Sandbox."
      - "[3] [4] The agent sends the command through sandbox-router to the runtime server, inside the micro-VM."
      - "[5] The code's syscalls go to the guest kernel, inside the VM."
      - "[6] Devices (disk, network) are virtio: the guest exits to Cloud Hypervisor, a user-space process on the node."
      - "[7] Cloud Hypervisor runs the vCPUs through /dev/kvm on the node VM. [8] That node VM is itself a guest of the OpenStack server's KVM: nested virtualisation."
  - id: card-background
    title: "Background · how a micro-VM sandbox comes up"
    color: amber
    lines:
      - "[A] The Sandbox controller creates the Pod; [B] Kyverno checks it uses RuntimeClass kata."
      - "[C] [D] The kubelet asks containerd for a pod sandbox with handler kata-clh."
      - "[E] containerd starts the Kata shim. [F] The shim boots a micro-VM with Cloud Hypervisor."
      - "[G] The shim tells kata-agent, over vsock, to create the containers inside the VM. [H] virtiofsd shares the image files with the guest."
  - id: card-objects
    title: "What differs from the gVisor tier"
    color: sky
    lines:
      - "Same CRDs, controllers, router and guardrails; only the RuntimeClass (kata) and what runs on the node change."
      - "Two kernels between the code and the node: the guest kernel, then the VM boundary enforced by KVM."
      - "Needs nested virtualisation on the compute host (or bare metal) and more RAM per sandbox."
  - {id: card-legend, title: Legend, color: slate, legend: true}
