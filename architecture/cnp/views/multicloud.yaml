cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-status
    title: "Where things stand (2026-10-18)"
    color: amber
    lines:
      - "**One Argo CD** on the K3s hub drives onprem, EKS and GKE. Each cloud is a cluster Secret synced by VSO from Vault kvv2/argocd/clusters/<cloud>. Vault, central Keycloak and the CMP stay on the hub, which is also the onprem target."
      - "**EKS and GKE** each get the platform base (Envoy Gateway, VSO, CNPG, local-path) from the platform-clouds ApplicationSet, plus one live project: letestaws / test-aws on EKS, letestgcp / test-gcp on GKE. A project lives on one cloud (target_cloud)."
      - "**The operator** creates the clusters by hand with cnp.sh up / down. Terraform registers the cluster in Vault, writes the auth config and publishes the node IP; Argo CD then syncs by itself (under a minute, checked live on a GKE down/up)."
      - "**[1] to [6]** user traffic reaches the app only through the project's own outbound tunnel, never through the hub; no LoadBalancer exists. GKE and onprem follow the same path, unnumbered."
      - "**WireGuard** [G] [H] only carries test relays. Argo CD, Vault and app traffic go over the public Internet, limited by allow-lists on the hub egress IP."
  - id: card-steps
    title: "Request path · data plane (EKS)"
    color: cyan
    lines:
      - "[1] The user opens <app>-<project>.3istor.com on Cloudflare (HTTPS 443, CNAME to the project tunnel)."
      - "[2] letestaws-tunnel, on EKS, opened a QUIC 7844 tunnel outbound; the request is relayed back over it."
      - "[3] cloudflared sends it to the letestaws-gateway-front Service, then Envoy (Gateway class eg, HTTP 80). With SSO, Envoy replies 302 to the central Keycloak."
      - "[4] HTTPRoute to the frontend Service :80 (nginx :3001)."
      - "[5] nginx proxies /api/ to the backend Service :8000."
      - "[6] The backend queries CNPG test-aws-db-rw :5432, on a local-path PVC."
  - id: card-background
    title: "Background · control plane"
    color: orange
    lines:
      - "[A] [B] Argo CD calls the EKS / GKE API :443 with the argocd-manager token."
      - "[C] [D] Vault calls the same API for TokenReview (SA vault-auth), mounts kubernetes-aws / -gcp."
      - "[E] [F] Cloud VSO logs in to vault.3istor.com and syncs app-registry, secrets and tunnel token."
      - "[G] [H] On-prem WireGuard pods initiate UDP 31820 to the cloud node (NodePort, pod 51820)."
      - "[I] [J] Terraform writes the cluster entry and auth config into Vault, and the node IP into the endpoint bucket."
      - "[K] The on-prem pod re-reads the endpoint every ~60 s when the last handshake is older than 180 s."
      - "[L] Argo CD polls cnp-projects. [M] [N] Image Updater reads GHCR tags, writes back to Git. [O] CMP writes the registry record. [P] [Q] Terraform state (S3, GCS)."
  - id: card-gaps
    title: "Gaps between the plan and the code"
    color: orange
    lines:
      - "!!G18!! **Sync after a long down.** Argo CD keeps retrying against the destroyed cluster's address; manual unblock (CNP-112)."
      - "!!G19!! **Frontend start order.** nginx resolves the backend at start and crashes until the Service exists (CNP-114)."
      - "!!G20!! **Shared VaultSecret.** Fullstack apps render app-registry from both Applications; one stays OutOfSync (CNP-115)."
      - "!!G3!! **Transport.** TLS ends at Cloudflare; behind the tunnel, hops are plain HTTP."
      - "Resolved since 09-30 (CNP-105, CNP-106): per-cloud Vault auth, per-project edge, cloud storage. G13 closed: clouds run HashiCorp VSO 3.0.0."
