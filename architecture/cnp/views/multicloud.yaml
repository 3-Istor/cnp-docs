cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-status
    title: "Where things stand (2026-10-29)"
    color: amber
    lines:
      - "**One Argo CD** on the K3s hub drives onprem, EKS and GKE. Vault and the central Keycloak stay on the hub, which is also the onprem target."
      - "**EKS and GKE** each run the platform base (Envoy Gateway, secret operator, CNPG, local-path) plus one live project: letestaws / test-aws, letestgcp / test-gcp."
      - "**The operator** creates the clusters by hand with cnp.sh; Argo CD then syncs by itself, in under a minute."
      - "User traffic reaches the app only through the project's own outbound tunnel, never through the hub. onprem and GKE follow the same path, unnumbered."
  - id: card-steps
    title: "Request path · data plane (EKS)"
    color: cyan
    lines:
      - "[1] The user opens <app>-<project>.3istor.com on Cloudflare (HTTPS 443)."
      - "[2] Cloudflare relays the request to the letestaws-gateway Service (Envoy, HTTP 80) through the tunnel opened outbound by letestaws-tunnel."
      - "[3] HTTPRoute to the frontend Service :80 (nginx :3001)."
      - "[4] nginx proxies /api/ to the backend :8000."
      - "[5] The backend queries CNPG test-aws-db-rw :5432, on a local-path PVC."
  - id: card-background
    title: "Background · control plane"
    color: orange
    lines:
      - "[A] [B] Argo CD syncs the EKS / GKE API server (:443)."
      - "[C] [D] The cloud secret operator logs in to Vault at vault.3istor.com :443, public, through Cloudflare."
      - "[E] [F] The on-prem WireGuard pods initiate UDP 31820 to the cloud node. Unlettered: three relays carry cloud metrics, logs and canary queries home (TCP 18080, 18082, 18083, see multicloud-links)."
      - "Unlettered: each project tunnel is opened outbound to Cloudflare (QUIC 7844)."
      - "Letters follow multicloud-links, which lists every link: [G] to [W] are there."
  - id: card-gaps
    title: "Gaps between the plan and the code"
    color: orange
    lines:
      - "!!G18!! Cloud Applications retry forever with refresh (CNP-112); deleting one while its cluster is down hangs on the finalizer."
      - "!!G19!! nginx crashes until the backend Service exists (CNP-114)."
      - "!!G20!! app-registry VaultSecret rendered twice, one OutOfSync (CNP-115)."
      - "!!G13!! Ricoberger operator: behaviour in a Vault outage untested."
      - "!!G3!! TLS ends at Cloudflare; behind the tunnel, plain HTTP."
