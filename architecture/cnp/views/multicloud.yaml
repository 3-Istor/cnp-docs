apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Multicloud · Where a project runs"
subtitle: "What runs where between the on-prem hub, EKS and GKE, and which links cross between them?"
meta:
  - "Scope: hub (K3s) and its onprem target, EKS cnp-eks and GKE cnp-gke with one project and one app each · main as of 2026-10-29 · derived from code, cluster behaviour checked live on 18/10"
  - "Out of scope: CMP and its project bootstrap · Image Updater · buckets, GitHub and the operator · per-project Keycloak (unused on clouds) · observability. Detail of every link between clusters, with the same letters: see multicloud-links."
  - "v0.5 (2026-10-29: tunnel relays to on-prem observability) · source: cnp-docs/architecture/cnp"

