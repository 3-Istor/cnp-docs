title: "CNP · Multicloud · Where a project runs"
subtitle: "What runs where between the on-prem hub, EKS and GKE, and which links cross between them?"
meta:
  - "Scope: hub (K3s) and its onprem target, EKS cnp-eks and GKE cnp-gke with one project and one app each · main as of 2026-10-18 · derived from code (Cloud, K3s, cnp-project-base, infra-templates), cluster behaviour checked live on 18/10"
  - "Out of scope: CMP up/down buttons (CNP-109) · per-project Keycloak (unused on clouds) · tenants and operators of the hub · observability · the access segregation plan · project bootstrap Terraform detail"
  - "v0.2 · source: cnp-docs/architecture/cnp"

