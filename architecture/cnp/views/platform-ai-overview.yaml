cards:
  - id: card-steps
    title: "How it works · a user asks an agent"
    color: emerald
    lines:
      - "[1]–[3] The request enters through Cloudflare and the shared Envoy Gateway, which logs the user in with Keycloak."
      - "[4] [5] Envoy routes it to the agent with the user's token; the agent exchanges it for its own short token (15 min at most)."
      - "[6] [7] Every model call goes to the AI gateway, which checks the token and the project, then the project's token budget."
      - "[8] [9] The gateway calls Gemini; on 429, or for a Local project, it falls back to Ollama on the homelab GPU over WireGuard."
      - "[10] [11] Tool calls go through the same gateway: OPA decides whether this agent may use this tool, ToolHive runs it."
      - "[12] [13] To run code, the agent claims a sandbox: gVisor by default, Kata for untrusted code. The code never runs in the agent pod."
      - "[14] [15] The gateway and the agent export GenAI spans and token metrics; Grafana shows cost and quota per project."
  - id: card-background
    title: "Set up before the request"
    color: amber
    lines:
      - "[A] [B] When a project gets an agent, the CMP creates its Keycloak client and stores its secret in Vault."
      - "[C] [D] The Secrets Operator mounts that secret in the agent pod and the Gemini key in the gateway, nowhere else."
      - "[E] [F] Argo CD applies everything from Git, the AI landing zone included; [I] it syncs EKS and GKE the same way."
      - "[G] Kyverno checks every pod at admission: restricted security context, the right RuntimeClass for each tier."
      - "[H] agent-sandbox watches claims and keeps warm sandboxes ready in each tier."
  - id: card-isolation
    title: "Isolation boundaries · what keeps what apart"
    color: rose
    lines:
      - "Network: Cilium default-deny per namespace. Tenants cannot reach each other; agents and sandboxes reach only the AI gateway (P0, IA-2)."
      - "Keys: provider keys live in Vault and the gateway only. An agent calling Gemini directly has no key and no route (red arrow)."
      - "Runtime, three tiers to choose from per agent: runc + seccomp for agents that don't run code; gVisor (user-space kernel) by default for generated code; Kata (micro-VM, own kernel) for untrusted code."
      - "Identity: one Keycloak client per agent, short tokens, every call carries the project; OPA decides per tool (IA-3)."
      - "Data: Gemini free tier only for non-sensitive data; Local projects stay on Ollama in the homelab."
  - {id: card-legend, title: Legend, color: slate, legend: true}

