cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · posting a tweet"
    color: emerald
    lines:
      - "[1] The browser opens frontend-epitweet.3istor.com; [2] the project tunnel relays to epitweet-gateway; [3] the gateway routes to the frontend, the only public app."
      - "[4] nginx proxies /api/posts to post-service:8082, an ExternalName alias of epitweet-post-service."
      - "[5] For a reply or a repost only, post-service asks social-graph whether either author blocked the other; [6] it stores the post in epitweet_posts, [7] publishes post.created."
      - "[8] Redis pushes post.created on timeline-service's open SUBSCRIBE connection (like and search get it too); [9] timeline asks social-graph for the followers, page by page, [10] then writes their timelines in epitweet_timelines."
      - "[A] Tunnel opened outbound. [B] The secret operator reads the generated credentials from Vault."
  - id: card-calls
    title: "Who calls whom"
    color: indigo
    lines:
      - "**REST, GET.** post and like → social-graph is-blocked-by; timeline → social-graph followers and → user /users/{id}."
      - "**Events (Redis pub/sub).** user.* → post, social-graph. post.* → like, search, timeline. like.* and social.* → timeline. social.block, unblock: no subscriber. Exact channels, no pattern subscription."
      - "**Data.** mongodb: one database per service (user, posts, likes, social_graph, timelines). neo4j: social graph. elasticsearch: search."
      - "Each arrow to another app is a dependsOn link: the caller's namespace gets an alias with the original hostname."
  - id: card-contract
    title: "Runtime contract"
    color: indigo
    lines:
      - "**Images.** ghcr.io/3-istor/imports/epitweet/<app> by digest. One Maven reactor build for the 6 Quarkus images: temurin 21 JRE, USER 185, MaxRAMPercentage."
      - "**Env.** The analyzer keeps compose's variables and rewrites hosts and credentials: REST client URLs, QUARKUS_REDIS_HOSTS, MongoDB and Neo4j URIs."
      - "**Secrets.** neo4j/password and admin:admin are replaced by credentials generated in Vault (kvv2 project-epitweet/<app>), synced by a VaultSecret."
      - "**Probes.** TCP on each service port: no health endpoint in the code."
      - "**Network.** All epitweet-* namespaces belong to project epitweet: the project ingress policy lets them reach each other. One mongod, five databases: one user per app scoped to its database is still to confirm (CNP-239)."
      - "**Storage.** Backing apps are StatefulSets with a ceph-block PVC, deleted with the app."
  - id: card-memory
    title: "Memory budget (requests)"
    color: amber
    lines:
      - "6 × 192Mi JVM · mongodb 384Mi · neo4j 768Mi · elasticsearch 1Gi · redis 64Mi · frontend 32Mi ≈ **3.4 GiB**."
      - "On-prem has about 4 GiB of requests left: it fits, tightly. Each app namespace keeps its 2Gi ResourceQuota."
      - "Off hours (01:00–07:00) the project sleeps. A public cloud fallback is prepared, not launched."
  - id: card-unsupported
    title: "Unsupported, flagged by the analyzer"
    color: orange
    lines:
      - "**api-gateway** in k8s/ has no source (nginx config in a ConfigMap): not imported; the frontend's nginx routes /api/*."
      - "**Health probes.** k8s/ declares /q/health/*, but no service depends on smallrye-health: TCP probes instead."
      - "**k8s/ ConfigMaps** lack the REST client and Redis URLs: the import follows docker-compose, not k8s/."
      - "**Pub/sub** keeps no message: a service asleep or restarting misses events."
