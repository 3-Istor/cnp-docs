notes:
  - {id: n-ag-order, text: "The docs run the traffic policies in a fixed order: JWT, authorization, rate limit, then the route and the backend policies, promptGuard among them. A prompt the guard refuses has therefore already passed the budget check."}
  - {id: n-ag-failover, text: "On a 429 the health policy evicts the Gemini key that answered it; the load balancer then picks another key of group 1, and when all are evicted, group 2: the GPU server. Keys of one Google project share one quota, so only keys from different projects add capacity."}
  - {id: n-ag-budget, text: "The budget is per agent and per day, keyed by a JWT claim (azp, to confirm in the phase 1 trial); cost per project is computed in Grafana. The check runs before the call; the real token count is known after the answer, and how the rate limit service receives it is for the trial to confirm."}

cards:
  - id: card-steps
    title: "Request path · an agent asks a model"
    color: emerald
    lines:
      - "[1] The agent sends POST /v1/chat/completions with its Keycloak JWT to the listener of the Gateway ai-gateway."
      - "[2] [3] jwtAuthentication checks the signature against the cached JWKS, iss and aud; authorization applies the CEL rules on the claims, deny by default."
      - "[4]–[6] rateLimit asks the rate limit service whether the agent's daily token budget is spent; the service counts in Redis. Over the budget: 429."
      - "[7] [8] The route match picks the HTTPRoute and its AgentgatewayBackend; promptGuard masks PII and secrets, then asks the guardrail adapter (IA-2)."
      - "[9] [10] The provider choice takes a healthy Gemini key of group 1; the LLM proxy speaks the provider's API with the key from the Secret."
      - "[11] [12] The call goes to Gemini over HTTPS through the Cilium FQDN egress rule. After a 429 the health policy evicts the key and the GPU server answers."
      - "[13] [14] The LLM proxy hands the token usage to the telemetry module, which sends the spans to Alloy over OTLP."
  - id: card-background
    title: "Background · control plane"
    color: amber
    lines:
      - "[A] The translator watches Gateway API and agentgateway objects, with the AgentgatewayPolicy among them."
      - "[B] The status writer reports accepted or rejected on the Gateway, its listeners and routes."
      - "[C] The Deployer creates the proxy Deployment for each Gateway of the agentgateway class."
      - "[D] The proxy keeps an ADS stream open to the xDS server and receives its configuration as deltas."
      - "[E] The proxy fetches Keycloak's JWKS and caches it."
      - "[F] Before [1], the agent gets a 5-minute JWT from Keycloak with its own client (client_credentials, or token exchange for a user)."
      - "[G] Alloy scrapes the metrics endpoint (:15020) for token and cost series."
  - id: card-objects
    title: "Objects · who points at whom"
    color: sky
    lines:
      - "Gateway ai-gateway → GatewayClass agentgateway. HTTPRoutes llm, llm-local, mcp and a2a → the Gateway (parentRef) and their AgentgatewayBackend (backendRef)."
      - "AgentgatewayBackend llm: group 1 = Gemini providers, one Secret each; group 2 = the GPU server (openai provider with host and port, token Secret). llm-local: the GPU server only."
      - "Budget: the global rateLimit of the policy (unit Tokens) points at the rate limit service, whose ConfigMap sets the limit per day; the local limiter has no day unit."
      - "AgentgatewayPolicy: auth and trace → Gateway; budget → HTTPRoute llm; guard and failover → backend llm; tools → backend mcp (targetRefs)."
      - "Not drawn: extProc and extAuth hooks of the same policy kind. OPA would use extAuth (IA-3)."
      - "Memory on the cluster: controller, proxy, rate limit service, Redis and the adapter should fit in a few hundred MB; to measure once deployed."
  - {id: card-legend, title: Legend, color: slate, legend: true}
