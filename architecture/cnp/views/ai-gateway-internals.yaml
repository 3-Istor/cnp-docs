title: "CNP · AI landing zone · AI gateway internals"
subtitle: "What is the AI gateway made of, and what happens inside it between an agent's request and the model's answer?"
meta:
  - "Scope: agentgateway on its own GatewayClass, beside Envoy Gateway, on-prem K3s · drawn in full: what the proposal adds (IA-1, guardrails, MCP and A2A in IA-2) · faded: what already runs"
  - "Out of scope: Vault and the secrets operator (zoom 6) · OPA through extAuth (IA-3) · the Envoy Gateway that serves apps and users · the same gateway on EKS and GKE"
  - "Assumed: Gemini through several keys in the first priority group, the GPU server in the second; one proxy replica. Resource names come from agentgateway.dev/docs/kubernetes/latest; the phase 1 trial confirms them"
  - "v0.2 · source: cnp-docs/architecture/cnp · agentgateway docs (architecture, policy order, LLM, MCP, A2A)"

