apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · AI landing zone · A model call"
subtitle: "What happens, in order, when a hosted agent asks a model and its daily budget runs out?"
meta:
  - "Scope: revised 2026-11-22 · one model provider, the Anthropic API · the connections of the ai-gateway view, nothing deployed"
  - "Out of scope: tool calls over MCP (same chain, then the mcp route) · traces and metrics (background of the ai-gateway view)"
  - "v0.3 · source: cnp-docs/architecture/cnp"
participants: [hosted-agent, keycloak, ai-gw-proxy, ai-ratelimit, anthropic]
steps:
  - {id: tx, from: hosted-agent, to: keycloak, over: c-agent-keycloak, text: "POST /token · token exchange, audience ai-gateway"}
  - {reply: tx, text: "JWT of 5 min, no refresh · sub = agent, project claim"}
  - {id: call, from: hosted-agent, to: ai-gw-proxy, over: c-agent-aigw, text: "model call + JWT"}
  - {note: ai-gw-proxy, text: "AgentgatewayPolicy: signature (cached JWKS), CEL on the claims, default deny"}
  - {id: quota, from: ai-gw-proxy, to: ai-ratelimit, over: c-aigw-ratelimit, text: "tokens left for this agent (azp) today?"}
  - {reply: quota, text: "OK · estimate reserved"}
  - {note: ai-gw-proxy, text: "promptGuard: built-in regex masks PII and secrets"}
  - {id: msg, from: ai-gw-proxy, to: anthropic, over: c-aigw-anthropic, text: "POST /v1/messages · claude-sonnet-5-5 · key from the Secret"}
  - {reply: msg, text: "token stream · usage"}
  - {note: ai-gw-proxy, text: "count real usage against the budget · emit the GenAI span"}
  - {reply: call, text: "SSE stream"}
  - {id: call2, from: hosted-agent, to: ai-gw-proxy, over: c-agent-aigw, text: "next model call + JWT"}
  - {id: quota2, from: ai-gw-proxy, to: ai-ratelimit, over: c-aigw-ratelimit, text: "tokens left?"}
  - {reply: quota2, text: "budget spent"}
  - {reply: call2, text: "429 until 00:00 UTC · Anthropic never called"}
