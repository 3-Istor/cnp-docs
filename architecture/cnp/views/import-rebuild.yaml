apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · Repo import · S5 Rebuild on push"
subtitle: "How does a push to the user's repo reach the cluster, on GitHub, on GitLab, and after the night's sleep?"
meta:
  - "Scope: S5 of the import design, planned (CNP-244) · the build and deploy steps are those of import-apply · design spec v2 (2026-11-13)"
  - "v0.1 · source: cnp-docs/architecture/cnp"

participants: [im-gh-import-app, im-gitlab-repo, im-import, im-build-prepare, pa-registry, argocd]

steps:
  - {id: hook, from: im-gh-import-app, to: im-import, over: c-im-gh-webhook, text: "push event · X-Hub-Signature-256"}
  - {note: im-import, text: "HMAC check · tracked repo and branch? new SHA: new import_build"}
  - {reply: hook, text: "202"}
  - {id: d1, from: im-import, to: im-build-prepare, over: c-im-import-dispatch, text: "workflow_dispatch {ids, SHA}"}
  - {note: im-build-prepare, text: "prepare, build, publish, callback: as in import-apply"}
  - {id: c1, from: im-import, to: pa-registry, over: c-im-import-registry, text: "commit the new digests"}
  - {id: p1, from: argocd, to: pa-registry, over: c-pa-argocd-registry, text: "poll, then sync"}
  - {id: poll, from: im-import, to: im-gitlab-repo, over: c-im-import-gitlab-poll, text: "GitLab: GET branch HEAD, every 5 min"}
  - {reply: poll, text: "SHA"}
  - {note: im-import, text: "new SHA or the Rebuild button: same dispatch"}
  - {note: im-import, text: "after the offhours wake-up (07:00): reconcile every tracked branch"}
  - {id: head, from: im-import, to: im-gh-import-app, over: c-im-import-gh-api, text: "GET branch HEAD per tracked repo"}
  - {reply: head, text: "SHA"}
  - {id: d2, from: im-import, to: im-build-prepare, over: c-im-import-dispatch, text: "one rebuild per missed push"}
