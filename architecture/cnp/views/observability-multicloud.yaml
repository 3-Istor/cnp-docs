state: diff
title: "CNP · Observability · Target: public clouds"
subtitle: "How do metrics, logs and traces of EKS and GKE reach the on-prem stores, who vouches for the cluster label, and what happens while a cloud is off?"
meta:
  - "Scope: the public cloud target drawn once for EKS cnp-eks and GKE cnp-gke (same platform base, cluster=aws|gcp), the WireGuard tunnel, the on-prem doors (vmauth, collector) and the alert chain · proposal of 2026-11-14 (CNP-185, D22, wave V6)"
  - "One door for every signal: metrics, logs and spans of a cloud enter through vmauth (relay 18080 for writes, 18083 for reads), with one user per cloud whose password Vault hands to the cloud. vmauth forces cluster=<cloud> on writes (extra_label, VL-Extra-Fields, a header the gateway turns into the cluster attribute) and pins reads to that cloud: no sender is trusted for its own label."
  - "Clouds are off most of the time. vmagent and Fluent Bit queue on disk while the tunnel is down and drain when it comes back; cnp.sh down waits for empty queues. CloudTelemetryMissing fires when Argo CD says a cloud is up and no sample arrived for 10 min."
  - "Out of scope: OpenCost (relay 18081, on-prem to cloud) · dual run: relay 18082 keeps feeding Loki until V2 ends, then is removed · per-project Grafana orgs · current stack: views observability and multicloud-links"
  - "v0.1 (2026-11-14, proposal) · source: cnp-docs/architecture/cnp"
