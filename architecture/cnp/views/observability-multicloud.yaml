cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · a pod fails on EKS, Discord says so with cluster=aws"
    color: emerald
    lines:
      - "[1] vmagent on the cloud scrapes kubelet, kube-state-metrics, node-exporter, Envoy and annotated pods every 30 s."
      - "[2] It remote_writes to the cloud end of the tunnel on 18080 as user cloud-aws. While the tunnel is down, samples wait in a 2 GiB disk queue."
      - "[3] socat relays the bytes through WireGuard, opened from on-prem (keepalive 25 s, the hub is behind NAT)."
      - "[4] The on-prem end forwards to vmauth, the one door of the stores (two replicas)."
      - "[5] vmauth checks the cloud's password, keeps only write paths for that user and adds cluster=aws to every sample: a cloud cannot write as another cluster."
      - "[6] [7] [8] vmalert evaluates the same rules for every cluster; Alertmanager groups by cluster too, so one Discord message names the cloud, the app and its runbook."
  - id: card-bg
    title: "Background"
    color: orange
    lines:
      - "[A] The hub opens the tunnel; the cloud end listens on NodePort UDP 31820. [B] Argo CD (platform-clouds ApplicationSet) installs the collectors on each cloud from the Cloud repo."
      - "[C] [D] [E] Fluent Bit tails pod logs, queues on disk, and writes through the same door; vmauth sets VL-Extra-Fields cluster=aws."
      - "[F] [G] [H] [I] Apps send OTLP to a collector on the cloud, which resolves pods there (the hub cannot: the relay hides the source IP). It forwards through vmauth, which adds X-CNP-Cluster; the gateway trusts only that header and routes each project to its own VictoriaTraces tenant."
      - "[J] [K] Argo Rollouts and OpenCost on the cloud read through relay 18083, as reader cloud-aws: read paths only, filters pinned to cluster=aws."
      - "[L] Relay 18082 still feeds Loki during the dual run of V2, then goes away."
      - "[M] Project Grafana orgs read traces through vmauth, tenant forced (Q9). [N] vmalert also runs log rules."
      - "New alerts: CloudTelemetryMissing (Argo CD says the cloud is up, no sample for 10 min), CloudQueueBacklog (disk queue over 500 MB). cnp.sh down waits for empty queues."
