apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · Repo import · S2 Linking GitLab"
subtitle: "How does a user let CNP read their GitLab projects on gitlab.com or gitlab.cri.epita.fr?"
meta:
  - "Scope: S2 of the import design, planned (CNP-240) · one OAuth application per GitLab instance · design spec v2 (2026-11-13)"
  - "Browser calls to the CMP cross Cloudflare, the platform tunnel and Envoy: folded into one hop."
  - "v0.1 · source: cnp-docs/architecture/cnp"

participants: [user, im-wizard, im-import, im-gitlab-oauth]

steps:
  - {id: open, from: user, to: im-wizard, over: c-im-user-wizard, text: "Project › Import › Connect GitLab, pick the instance"}
  - {id: start, from: user, to: im-import, over: c-im-user-import, text: "POST /api/import/gitlab/link?instance=…"}
  - {note: im-import, text: "single-use state + PKCE verifier"}
  - {reply: start, text: "302 → /oauth/authorize · scope read_repository read_api · code_challenge"}
  - {id: auth, from: user, to: im-gitlab-oauth, over: c-im-user-gitlab, text: "sign in on GitLab, approve the scopes"}
  - {reply: auth, text: "302 → CMP callback ?code&state"}
  - {id: cb, from: user, to: im-import, over: c-im-user-import, text: "GET /api/import/gitlab/callback"}
  - {note: im-import, text: "state must match, consumed once"}
  - {id: tok, from: im-import, to: im-gitlab-oauth, over: c-im-import-gitlab-oauth, text: "POST /oauth/token · code + verifier"}
  - {reply: tok, text: "access + refresh tokens"}
  - {note: im-import, text: "Fernet-encrypted; refreshed before each use"}
  - {reply: cb, text: "linked · project picker"}
