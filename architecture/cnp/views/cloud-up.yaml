apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · Multicloud · cnp.sh up"
subtitle: "What happens, in order, when an operator runs cnp.sh up for a public cloud?"
meta:
  - "Scope: EKS and GKE alike, written <cloud> · main as of 2026-10-29 · derived from code: Cloud/terraform/public/{aws/EKS,gcp/GKE}/{cnp.sh,main.tf}, modules/cluster-addons, platform/kustomization.yaml, K3s/k8s/app/{platform-clouds,wireguard-clouds}.yaml, K3s/k8s/config/wireguard/settings*.env, CMP/backend/app/services/clusters/state.py"
  - "Prerequisites: ssh pae-node-1 open with DynamicForward 1080 · VAULT_ADDR=https://vault.3istor.com and vault login · AWS_PROFILE=cnp · gcloud ADC (GKE) · terraform.tfvars. Once by hand: vault kv put kvv2/cnp-vpn/<cloud> and the mount kubernetes-<cloud>. What down removes: docs/06-multicloud/07-procedures-operateur.md"
  - "Arrows: purple = background request, red = authentication, amber = tunnel, grey = traffic. Notes in grey say what survives cnp.sh down and the known gaps."
  - "v0.3 · source: cnp-docs/architecture/cnp"

participants: [operator, pae-node-1, cloud-control, cloud-api, vault, endpoint-bucket, vso, argocd, cloud-vso, cloud-alloy, cloud-wg, up-wg-onprem, vm-vminsert, loki-gateway, up-cmp, up-hub-api]

steps:
  # Every cnp.sh command starts with the proxy check (CNP-166).
  - {note: operator, text: "plan, up, down, kubeconfig: abort unless 127.0.0.1:1080 answers"}
  - {id: socks, from: operator, to: pae-node-1, over: c-op-pae, text: "ssh -D 1080 (SOCKS5)"}
  - {note: pae-node-1, text: "the cloud APIs see 176.186.130.237 · api_allowed_cidrs = the K3s egress 176.186.130.237/32"}

  # Terraform, by hand: cluster, node, then the cluster-addons module.
  - {id: apply, from: operator, to: cloud-control, over: c-up-op-cloud, text: "create cluster, node group, firewall UDP 31820"}
  - {note: cloud-control, text: "EKS: vpc-cni prefix delegation, 110 pods per new node · GKE: logging and monitoring none"}
  - {id: sas, from: pae-node-1, to: cloud-api, over: c-up-op-api, text: "create SAs argocd-manager, vault-auth"}
  - {id: entry, from: operator, to: vault, over: c-op-vault, text: "write kvv2/argocd/clusters/<cloud>"}
  - {id: auth, from: operator, to: vault, over: c-op-vault, text: "write auth/kubernetes-<cloud>/config"}
  - {id: key, from: operator, to: vault, over: c-op-vault, text: "read kvv2/cnp-vpn/<cloud>"}
  - {reply: key, text: "WireGuard private key"}
  - {note: vault, text: "kept across down: cluster entry, auth mount, roles incl. observability-role, VPN keys"}
  - {id: secret, from: pae-node-1, to: cloud-api, over: c-up-op-api, text: "create ns cnp-vpn + Secret wireguard-key"}
  - {id: endpoint, from: operator, to: endpoint-bucket, over: c-op-endpoint, text: "put <cloud> = node IP:31820"}
  - {id: ready, from: pae-node-1, to: cloud-api, over: c-up-op-api, text: "kubectl wait nodes Ready"}
  - {note: operator, text: "done by hand; the rest is automatic"}

  # Automatic: the hub registers the cluster, Argo CD syncs.
  - {id: vso-read, from: vso, to: vault, over: e-a-vso-vault, text: "read cluster entry (< 1 min)"}
  - {note: vso, text: "refresh Argo CD Secret cluster-<cloud>"}
  - {id: sync-base, from: argocd, to: cloud-api, over: c-up-argocd-api, text: "sync platform-<cloud> and wireguard-<cloud>"}
  - {note: argocd, text: "one sync installs Envoy, CNPG, VSO, guardrails, Alloy, exporters, Rollouts, Kyverno, Trivy, offhours-guard"}
  - {note: argocd, text: "CNP-112: cloud Applications retry forever, backoff 30 s to 3 min, refresh to the last commit"}
  - {id: login, from: cloud-vso, to: vault, over: c-up-cvso-vault, text: "login auth/kubernetes-<cloud>"}
  - {id: review, from: vault, to: cloud-api, over: c-up-vault-api, text: "TokenReview (SA vault-auth)"}
  - {reply: login, text: "token"}
  - {note: cloud-vso, text: "secrets synced, incl. loki-clients (observability-role) for Alloy"}
  - {id: sync-boot, from: argocd, to: cloud-api, over: c-up-argocd-api, text: "sync project bootstraps"}
  - {id: sync-apps, from: argocd, to: cloud-api, over: c-up-argocd-api, text: "sync apps"}

  # Automatic: the tunnel comes back, then telemetry flows home.
  - {note: up-wg-onprem, text: "no handshake for 180 s"}
  - {id: reread, from: up-wg-onprem, to: endpoint-bucket, over: c-up-wg-endpoint, text: "re-read <cloud> (every ~60 s)"}
  - {reply: reread, text: "node IP:31820"}
  - {id: hs, from: up-wg-onprem, to: cloud-wg, over: c-up-wg-cloud, text: "handshake · UDP 31820"}
  - {note: cloud-wg, text: "tunnel up"}
  - {note: cloud-alloy, text: "fails until the handshake; label cluster=<cloud>"}
  - {id: push, from: cloud-alloy, to: cloud-wg, over: c-up-alloy-wg, text: "metrics :18080, logs :18082"}
  - {id: relay, from: cloud-wg, to: up-wg-onprem, over: c-up-cwg-onprem, text: "relay to the on-prem tunnel IP"}
  - {id: write, from: up-wg-onprem, to: vm-vminsert, over: c-up-wg-vminsert, text: "metrics → vminsert :8480"}
  - {id: write-logs, from: up-wg-onprem, to: loki-gateway, over: c-up-wg-lokigw, text: "logs → loki-gateway :80"}

  # Automatic: the CMP sees the cluster.
  - {id: state, from: up-cmp, to: up-hub-api, over: c-up-cmp-state, text: "read Application wireguard-<cloud> (cache 60 s)"}
  - {note: up-cmp, text: "absent → unknown · Progressing → starting · Healthy, sync ≠ Unknown, no *Error condition → up, else down; list views use a 60 s cache, the deploy guard reads fresh (unknown retried 4 × 5 s)"}
