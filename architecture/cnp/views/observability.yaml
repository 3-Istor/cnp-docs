subtitle: "Who writes and reads metrics, logs and traces on the hub, and how does an alert reach Discord?"
meta:
  - "Scope: on-prem hub, write path of metrics, logs and traces, reads by projects and platform, the single alert chain, the audit archive and the planned AI audit record · main as of 2026-11-21 (CNP-185 waves V1 to V4; Loki, Alloy and the VictoriaMetrics cluster removed by CNP-276) · derived from code (K3s/k8s/config/observability, K3s/k8s/config/arcl-cmp/cmp-values.yaml)"
  - "Out of scope: public clouds (view observability-multicloud), NetworkPolicies (one per store, D8), Gatus and OpenCost internals, dashboards"
  - "v1.0 (2026-11-21: the 2026-11-13 target is the platform) · source: cnp-docs/architecture/cnp"
