apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Observability · Collection from three clusters"
subtitle: "How do metrics, logs and audit events of on-prem, EKS and GKE reach the on-prem stores?"
meta:
  - "Scope: write path of the three clusters, the WireGuard relays, VictoriaMetrics, Loki, Ceph RGW and the audit archive · main as of 2026-10-29 · derived from code (K3s/k8s/config/{observability,wireguard}, K3s/terraform/{loki,audit}.tf, Cloud/terraform/public/platform)"
  - "Out of scope: the read side and per-project isolation (see observability-read) · OpenCost internals (FinOps view, later) · Kyverno, Trivy · dashboards"
  - "v0.1 · source: cnp-docs/architecture/cnp"

