cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · a failing app becomes a Discord message"
    color: emerald
    lines:
      - "[1] vmagent scrapes Envoy, kubelet, kube-state-metrics, Hubble and annotated pods every 30 s, and forces the namespace label."
      - "[2] It remote_writes to VMSingle :8429: 30 days, cluster=onprem."
      - "[3] vmalert cnp evaluates platform rules and the VMRules the CMP writes per project, each group pinned to the project's namespaces."
      - "[4] It sends firing alerts to Alertmanager :9093, which groups them and picks the app webhook, else the project's, else the platform's."
      - "[5] One Discord message per group: value, runbook, portal link."
  - id: card-bg
    title: "Background"
    color: orange
    lines:
      - "[A] The CMP provisions each project org in Grafana. [B] Every hour audit-archive-vlogs exports the audit streams with LogsQL and puts them in cnp-audit-archive on Ceph RGW (Object Lock, 180 days)."
      - "[C] [D] Fluent Bit tails pod logs and the k3s audit.log, and inserts into VictoriaLogs :9428 (30 days, 16 GiB cap)."
      - "[E] [F] [G] [H] Template apps expose /metrics and send OTLP spans; the AI landing zone will send GenAI spans. The collector matches the pod from the connection, strips client k8s.* attributes and PII, and exports each project to its own VictoriaTraces tenant."
      - "[I] to [P] Reads: project Grafana orgs go through vmauth (one user per project, read paths only, filters forced). Org 1, the CMP and Argo Rollouts read the stores directly, behind NetworkPolicies, so a vmauth outage never aborts a canary."
      - "[Q] vmalert vlogs runs the LogsQL security rules. [R] [S] The CMP mutes alerts (project matcher forced) and posts its own events in the same format."
      - "[T] [U] A Watchdog alert pings the dead man's switch every 5 min; silence for 15 min means the alert chain is down."
      - "[V] vmbackup (planned) would copy metrics to Ceph RGW daily. [W] [X] audit-record (V6) reads each finished agent run, signs it with Vault transit, and puts it under Object Lock for 180 days."
      - "[Y] Project Grafana orgs read their traces through vmauth, which forces the project's tenant (Q9). [Z] Cloud spans come in through vmauth (view observability-multicloud)."
  - id: card-replaces
    title: "Removed on 2026-11-21 (CNP-276)"
    color: rose
    lines:
      - "**Alloy** (1.8 GiB on two nodes) → vmagent + Fluent Bit."
      - "**Loki**, its nginx gateway and per-project tenants → VictoriaLogs + vmauth filters; the logcli audit archive → LogsQL."
      - "**VM cluster** (vminsert, vmselect, vmstorage) → VMSingle."
      - "**Grafana-managed project alerts**, the Loki ruler → vmalert. Custom Grafana rules of projects stay."
      - "History: Loki logs of 22/10 to 15/11 copied into VictoriaLogs (source=loki), VM cluster series of 01/11 to 15/11 into VMSingle."
