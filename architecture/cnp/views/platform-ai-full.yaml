steps: [hl-c-user-entry, hl-c-entry-agw, hl-c-agw-agents, hl-c-agents-agw, hl-c-agw-guard, hl-c-guard-ollama, hl-c-agw-gemini, hl-c-agw-ollama, hl-c-agw-tools, hl-c-agw-peers, hl-c-agents-sandbox]
background: [hl-c-portal-kagent, hl-c-kagent-agents, hl-c-agents-identity, hl-c-agw-obs]

cards:
  - id: card-steps
    title: "Le parcours d'une requête"
    color: emerald
    lines:
      - "[1] [2] L'utilisateur entre par Cloudflare et Envoy, qui confie sa question à la gateway agentique."
      - "[3] [4] La gateway la transmet à l'agent ; tout ce que l'agent appelle ensuite repasse par elle."
      - "[5] [6] Les guardrails masquent données personnelles et secrets, puis Llama Guard juge le prompt."
      - "[7] [8] La gateway appelle Gemini, ou Ollama sur le GPU du homelab en secours et pour les projets Local."
      - "[9] [10] Un appel d'outil va à ToolHive ; une tâche déléguée va à un autre agent, en A2A."
      - "[11] Le code que l'agent écrit tourne dans un sandbox gVisor ou Kata, jamais dans son pod."
  - id: card-background
    title: "Mis en place avant"
    color: amber
    lines:
      - "[A] [B] La CMP écrit l'agent dans Git, Argo CD l'applique, kagent le déploie."
      - "[C] L'agent obtient un jeton court de Keycloak avec son ServiceAccount : aucun secret dans le pod."
      - "[D] La gateway envoie traces et compteurs de tokens à l'observabilité."
      - "Les flux estompés sont ceux d'aujourd'hui : les apps, la CMP, GitOps vers GitHub et vers EKS et GKE."
  - id: card-isolation
    title: "Les frontières d'isolation"
    color: rose
    lines:
      - "Réseau : default-deny Cilium, l'agent ne sort que vers la gateway."
      - "Clés : les clés Gemini n'existent que dans Vault et la gateway."
      - "Exécution : runc pour l'agent, gVisor ou Kata pour le code qu'il génère."
      - "Admission : Kyverno n'accepte que des pods restreints et des images signées."
  - {id: card-legend, title: Légende, color: slate, legend: true}

