state: diff
title: "CNP · La plateforme et sa landing zone IA en un coup d'œil"
subtitle: "Toute la plateforme actuelle, estompée, et ce que la landing zone IA ajoute, en clair : tout le trafic des agents passe par la gateway"
meta:
  - "Périmètre : hub K3s on-prem, option B du 2026-10-23 (agentgateway + kagent) · en clair : ce que la landing zone IA ajoute · estompé : ce qui tourne déjà"
  - "Une boîte par brique, plateforme actuelle comprise ; le détail est dans platform-ai-stack et les vues zoom"
  - "v1.0 · source : cnp-docs/architecture/cnp"

