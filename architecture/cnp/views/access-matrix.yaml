apiVersion: noodle/v1alpha1
kind: View
type: matrix
title: CNP · Access matrix · what the segregation plan and the portal roles change
subtitle: One row per identity, one column per resource by access plane, the CMP portal included. A cell shows the level after the plan, and what the plan changed to get there.
meta:
  - "Read a row: everything an identity can do. Read a column: who can touch a resource. A workload column touched by another project's identity is a leak."
  - "Not verified: the policy of the CMP's Vault token (G15, drawn as the root token), the scope of its Cloudflare token (G16), the members' GitHub base permission (G17, main is unprotected: checked) and who holds Cloudflare super admin, drawn as the platform admin. GCP project roles (G22), drawn as the platform admin."
  - "Plan phases: P1 root accounts and audit trail, P2 CMP rights, P3 tenant isolation and GitOps protection, P4 cloud accounts."
  - "Portal lots (CNP-228): L1 authorization holes, L2 Keycloak groups, L3 roles read from Keycloak by the portal, L4 Grafana and Argo CD, L5 cleanup. The same identities hold the platform and the portal."
  - "Out of scope: a token issued to another realm client was accepted by the portal API (closed in L1). It carried its user's rights, so it changes no cell."
state: diff
identities:
  - {title: Break-glass, items: [root]}
  - {title: People, sub: "a Keycloak group, OIDC + MFA", items: [admin, grp-infra-elevated, auditor, finops, grp-member, owner-a, admin-a, dev-a, guest-a, grp-k3s-dev]}
  - {title: Service accounts, items: [cmp-backend, vso, argocd]}
resources:
  - {title: Control plane, sub: identity and rules, color: indigo, items: [keycloak, vault-sys, audit-logs]}
  - {title: Management plane, sub: what runs and deploys the platform, color: cyan, items: [apps-platform, kube-apiserver, github, gh-project-repos, cf-edge, tfstate, vault-kvv2, grafana]}
  - {title: Workloads plane, sub: a project is a closed box, color: slate, items: [vault-a, apps-a, g-tenant-a, vault-b, apps-b, g-tenant-b]}
  - {title: Portal, sub: what the CMP lets a person do, color: sky, items: [cmp-apps-a, cmp-logs-a, cmp-security-a, cmp-costs-a, cmp-project-b, cmp-platform-view, cmp-finance, cmp-settings]}
  - {title: Public clouds, sub: "AWS organization from P4, GCP project", color: amber, items: [aws-account-mgmt, aws-account-logs, aws-account-workloads, eks-cluster, gcp-project, gke-cluster]}
