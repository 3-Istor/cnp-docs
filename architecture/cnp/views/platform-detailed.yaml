cards:
  - id: card-steps
    title: "Request path · a user asks an agent that runs code, calls a model and a tool"
    color: emerald
    lines:
      - "[1] [2] The user signs in to Keycloak and asks the agent, sending a user token. [3] The agent exchanges it for its own short token (or uses client_credentials when it acts alone)."
      - "[4] The agent creates a SandboxClaim; the controller hands it a warm sandbox from the pool of the chosen tier. [5] [6] It sends commands through the sandbox router, which forwards them to the sandbox pod (gVisor here; Kata the same way)."
      - "[7] The agent asks a model at the AI gateway's internal listener; JWT and CEL checks run, then [8] the rate limit service checks the token budget."
      - "[9] The LLM proxy sends the request to Gemini; [10] after a 429 the failover policy sends it to the GPU server."
      - "[11]–[13] A tool call on /mcp goes through the MCP proxy of the gateway to the ToolHive proxy, then to the MCP server over JSON-RPC."
      - "[14] [15] The gateway exports GenAI metrics and spans to Alloy, which writes traces to Tempo and metrics to Prometheus."
  - id: card-background
    title: "Background · what is set up before the request"
    color: amber
    lines:
      - "[A] [B] When a project gets an agent, the CMP creates its Keycloak client and writes the client secret to Vault."
      - "[C] [D] The secrets operator reads it and writes the Kubernetes Secret mounted by the agent."
      - "[E] [F] [G] The agentgateway controller, the sandbox controller and the ToolHive operator watch their CRDs and configure the proxy or write what they generate (pods, services)."
      - "[H] Argo CD applies everything from Git, the AI landing zone included."
      - "[I] The WireGuard tunnel to the homelab GPU stays up, so Ollama is one hop away."
  - {id: card-legend, title: Legend, color: slate, legend: true}

