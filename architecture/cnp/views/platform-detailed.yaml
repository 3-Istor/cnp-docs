apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · Platform overview · detailed, with the AI landing zone"
subtitle: "Every zoom on one canvas: the hub as it runs today and the AI landing zone down to its policies, controllers and kernels"
meta:
  - "Scope: on-prem K3s hub and the AI landing zone proposal of 2026-10-23 · drawn in full: what the proposals add (P0–P2, IA-1–IA-3) · faded: what already runs"
  - "Three sandbox tiers side by side: standard (runc), gVisor and Kata, each on its own worker node; a platform can offer one, two or all three"
  - "Out of scope: EKS and GKE internals (multicloud views) · RBAC and grants (access matrix) · CI pipelines"
  - "v0.1 · source: cnp-docs/architecture/cnp · each zoom view lists its own sources"

