cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · a project dashboard"
    color: emerald
    lines:
      - "[1] A panel of the project's Grafana org queries vmauth :8427 as user project-<p> (datasource provisioned by the CMP)."
      - "[2] vmauth keeps the read paths only and forwards to VMSingle :8429 with extra_filters on the project's namespaces."
  - id: card-bg
    title: "Background"
    color: orange
    lines:
      - "[A] [B] Logs and traces of the project org take the same door: vmauth adds the namespace filter for VictoriaLogs and forces the project's VictoriaTraces tenant."
      - "[C] Org 1 (platform admins) reads the stores directly, unfiltered."
      - "[D] [E] [F] The CMP reads VMSingle, VictoriaLogs (LogsQL, LOGS_BACKEND=vl) and VictoriaTraces directly. Dotted: it rewrites the Secret vmauth-projects, one user per project; vmauth reloads it."
      - "[G] Argo Rollouts analysis queries VMSingle on-prem; on EKS and GKE through the tunnel relay :18083 (observability-multicloud)."
      - "[H] [I] vmalert cnp evaluates metric rules and the CMP's per-project VMRules; vmalert vlogs runs the LogsQL security rules. [J] Both fire to Alertmanager. [K] Alertmanager posts to the app's, the project's or the platform's Discord webhook."
      - "[L] The CMP mutes alerts with a project matcher. [M] It provisions each project org in Grafana. [N] It posts app health and budget alerts to Discord itself."
  - id: card-iso
    title: "How a project sees only its own"
    color: rose
    lines:
      - "**Metrics, logs, traces**: one vmauth user per project, read paths only, filters forced on the namespace field, the tenant forced for traces."
      - "**Logs**: Fluent Bit rebuilds every record from Kubernetes metadata, so a pod cannot write namespace: victim in its JSON (spoofing test passed in V2)."
      - "**Stores**: NetworkPolicies admit vmauth, vmalert, Grafana, the CMP backend, Argo Rollouts and the collectors only."
      - "**Grafana**: project admins are Editors in their org and cannot edit datasources."
  - id: card-gaps
    title: "Gaps"
    color: orange
    lines:
      - "!!GO3!! The vmauth filter matches namespaces only: a namespace name reused on two clusters would leak between projects."
      - "Org 1 and the CMP read the stores unfiltered, by design: platform side only."
      - "!!G7!! CMP API auth (see the platform views)."
