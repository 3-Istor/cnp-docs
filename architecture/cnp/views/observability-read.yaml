apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Observability · Reading and project isolation"
subtitle: "Who reads metrics, logs and traces, and how does each project see only its own?"
meta:
  - "Scope: Grafana orgs, vmauth, the three stores, CMP and Argo Rollouts reads, the alert chain to Discord · main as of 2026-11-21 (after CNP-276) · derived from code (K3s/k8s/config/observability, K3s/k8s/config/arcl-cmp/cmp-values.yaml)"
  - "Out of scope: the write path (see observability) · OpenCost · dashboards · how users log in to Grafana · cloud readers (observability-multicloud)"
  - "v1.0 (2026-11-21: VictoriaMetrics stores, no Loki) · source: cnp-docs/architecture/cnp"

