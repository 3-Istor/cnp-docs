notes:
  - {id: n-md-terms, text: "Check before going live: Google's Gemini API terms allow only the paid service when an API client is made available to users in the EEA, the UK or Switzerland. Free-tier inputs may also be read by human reviewers and used to improve Google's products: no sensitive data."}
  - {id: n-md-local, text: "Local projects: jwt_authn copies the data_level claim into x-cnp-data; the llm-local route matches it and only knows Ollama, so Gemini is never a candidate, even on retry."}
  - {id: n-md-fit, text: "16 GB VRAM: one 8 to 14B chat model at 4-bit with its KV cache, or a smaller one beside Llama Guard 3. With MAX_LOADED_MODELS 1, switching model means a reload of several seconds."}

cards:
  - id: card-steps
    title: "Request path · a model call leaves the gateway"
    color: emerald
    lines:
      - "[1] The router picks the rule: llm for normal projects (Gemini priority 0, Ollama priority 1), llm-local for Local projects (Ollama only)."
      - "[2] The upstream filters translate and sign the request, then Envoy calls Gemini's OpenAI-compatible endpoint over HTTPS; the Cilium egress rule allows that host only."
      - "[3] Google counts the request against the project's RPM, TPM and RPD. If any one is spent, the answer is 429."
      - "[4] On 429, or for Local projects, Envoy retries on Ollama through the WireGuard pod. [5] The homelab peer forwards to Ollama on port 11434. [6] Ollama runs the model on the RTX 5080."
  - id: card-background
    title: "Background"
    color: amber
    lines:
      - "[A] The WireGuard pod keeps the tunnel to the homelab peer up; only the GPU host's /32 is routed through it."
      - "[B] Ollama loads a model's weights from its store on first use and keeps them for KEEP_ALIVE (30 min here)."
  - id: card-objects
    title: "Objects · who points at whom"
    color: sky
    lines:
      - "AIGatewayRoute llm → AIServiceBackend gemini and ollama; llm-local → ollama only."
      - "AIServiceBackend gemini → Backend gemini (FQDN, TLS); ollama → Backend ollama (homelab IP)."
      - "BackendTrafficPolicy: retry on 429 and token rate limit; SecurityPolicy: JWT and claimToHeaders."
  - {id: card-legend, title: Legend, color: slate, legend: true}
