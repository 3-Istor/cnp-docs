apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · AI landing zone · Models internals"
subtitle: "Where does a model call end up, what limits it, and how does it fall back to the GPU server?"
meta:
  - "Scope: Gemini API free tier with several keys in the first priority group, the GPU server in the second (an external element defined by its contract, spec section 5), proposal of 2026-10-25 · drawn in full: what the proposal adds (IA-1, IA-2) · faded: what already runs"
  - "Out of scope: the gateway's policy order (AI gateway internals) · what runs on the GPU server and its own platform · the Gateway API Inference Extension, useful only with several GPU replicas"
  - "Assumed: the GPU server sits on the same local network as the cluster and is reached over HTTPS, with Cilium egress limited to its /32 (no WireGuard); a transformation copies the data_level claim into the header x-cnp-data (open point 2 of the spec)"
  - "v0.2 · source: cnp-docs/architecture/cnp · ai.google.dev (rate limits, Gemini API additional terms) · agentgateway docs (LLM failover and load balancing)"

