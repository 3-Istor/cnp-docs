apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · AI landing zone · Models internals"
subtitle: "Where does a model call end up, what limits it, and how does it fall back to the homelab GPU?"
meta:
  - "Scope: Gemini API free tier through its OpenAI-compatible endpoint, Ollama on the homelab RTX 5080 over WireGuard, proposal of 2026-10-23 · drawn in full: what the proposal adds (IA-1) · faded: what already runs"
  - "Out of scope: the gateway's filters (AI gateway internals) · the homelab cluster's own platform · the Gateway API Inference Extension, useful only with several GPU replicas"
  - "Assumed: one Google Cloud project with one API key; the jwt filter copies the data_level claim into the header x-cnp-data (claimToHeaders)"
  - "v0.1 · source: cnp-docs/architecture/cnp · ai.google.dev (rate limits, Gemini API additional terms)"

