apiVersion: noodle/v1alpha1
kind: View
type: topology
state: diff
title: "CNP · AI landing zone · Models internals"
subtitle: "Where does a model call end up, and what limits what it costs?"
meta:
  - "Scope: one model provider, the Anthropic API with one key (decisions of 2026-11-22) · drawn in full: what the proposal adds (IA-1) · faded: what already runs"
  - "Out of scope: the gateway's policy order and the token budget (AI gateway internals) · Anthropic server tools (web search) · code mode, which runs in the agent sandbox (agent sandbox views)"
  - "Assumed: agentgateway has an Anthropic provider and keeps the per-azp budget; to check in trial T1.1"
  - "v0.3 · source: cnp-docs/architecture/cnp · platform.claude.com docs (Messages API, pricing) · agentgateway docs (LLM providers)"

include:
  - z-cluster
  - g-ai-gateway
  - g-ag-crd-gw
  - ag-route
  - g-ag-crd-agw
  - ag-be-llm
  - ag-secret
  - g-ag-polb
  - ag-pol-guard
  - g-md-egress
  - md-egress
  - g-ag-pod
  - g-ag-chain
  - ag-f-pick
  - ag-x-llm
  - z-anthropic
  - anthropic
  - md-spend

steps: [c-ag-chain-7, c-ag-anthropic, c-md-spend]
background: []

labels:
  c-ag-chain-7: ""
  c-ag-anthropic: "POST /v1/messages · HTTPS"
  c-md-spend: ""
  r-ag-route-llm: ""
  r-ag-be-secret: ""
  r-ag-pol-guard: ""

notes:
  - {id: n-md-terms, text: "Prompts and answers leave for Anthropic. promptGuard masks PII and secrets with its built-in regexes before the call; a critical project cannot enable AI at all. There is no Local data level any more."}
  - {id: n-md-local, text: "No fallback: if the API is down or the spend limit is reached, the call fails with a clear error, never a degraded mode (principle 6)."}
  - {id: n-md-contract, text: "The model is a setting: claude-sonnet-5-5 by default (effort medium, adaptive thinking), claude-haiku-5-5 for cheap work such as a reader agent or a classification. Per MTok: Sonnet 5.5 $2 in, $10 out, $0.10 cache read; Haiku 5.5 $0.10 in, $0.50 out."}

cards:
  - id: card-steps
    title: "Request path · a model call leaves the gateway"
    color: emerald
    lines:
      - "[1] The provider choice sends the call to the one backend, llm, with a model the project allows."
      - "[2] The LLM proxy calls the Anthropic Messages API with the key from the Secret, over HTTPS; the Cilium egress rule allows api.anthropic.com:443 only."
      - "[3] Anthropic counts the spend against the console limit: the hard money fuse, on top of the gateway's daily token budget per agent."
  - id: card-background
    title: "Background"
    color: amber
    lines:
      - "VSO writes the Secret anthropic-api-key from Vault kvv2/platform/ai/anthropic, in the ai-gateway namespace only. Kyverno ai-no-provider-keys refuses a provider key in any other namespace."
  - id: card-objects
    title: "Objects · who points at whom"
    color: sky
    lines:
      - "HTTPRoute llm → AgentgatewayBackend llm (provider anthropic) → Secret anthropic-api-key."
      - "AgentgatewayPolicy guard → backend llm: built-in regex masking, no external classifier."
  - {id: card-legend, title: Legend, color: slate, legend: true}
