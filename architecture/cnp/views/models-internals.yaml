labels:
  c-ag-chain-5: ""
  c-ag-gemini: "POST /v1beta/openai/chat/completions · HTTPS"
  c-md-quota: ""
  c-ag-ollama: "on 429 or Local · HTTP over WireGuard"
  c-md-hl-fwd: ""
  c-md-gpu: ""
  c-md-tunnel: "WireGuard · UDP"
  c-md-store: ""
  r-ag-route-gemini: ""
  r-md-project: ""
