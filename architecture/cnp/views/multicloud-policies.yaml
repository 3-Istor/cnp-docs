type: topology
title: "CNP · Multicloud · Who may reach a project"
subtitle: "What may reach a project's workloads and the tunnel relays on each cluster, and what enforces it?"
meta:
  - "Scope: ingress to one project's namespaces on on-prem (K3s), EKS and GKE, the cloud perimeter and the cloud end of the tunnel relays · main as of 2026-10-29 · derived from code; project matrix of 18/10 checked live (marked live)"
  - "Out of scope: egress (open everywhere) · the hub's own namespaces, except the on-prem end of the relays (card) · admission of tenant workloads beyond the cloud guardrails. Drawn as a topology: a matrix holds grants, not network rules."
  - "v0.2 · source: cnp-docs/architecture/cnp"
