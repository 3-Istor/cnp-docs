cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-rules
    title: "Per cluster"
    color: rose
    lines:
      - "**On-prem:** one CiliumClusterwideNetworkPolicy per project, cnp-project-<p>-ingress. It allows the project's namespaces, envoy-gateway-system, observability, cnpg-system and host / remote-node (probes). Everything else is dropped."
      - "**EKS, GKE:** one NetworkPolicy cnp-project-ingress per project namespace, same sources, no host rule. Enforced by the VPC CNI agent (enableNetworkPolicy) on EKS and Dataplane V2 on GKE."
      - "**Both policies exist only when features.workloads and features.networkIsolation are on (default true).**"
      - "**Live 18/10, EKS and GKE only:** same namespace allowed, same project other namespace allowed, default to project blocked, kubelet probes OK, DNS and Internet egress OK."
      - "**Cloud perimeter:** UDP 31820 only from vpn_source_cidrs, API :443 only from api_allowed_cidrs. Both: api_allowed_cidrs = the K3s egress 176.186.130.237/32. The operator gets there through the SOCKS proxy on pae-node-1. EKS API access entry for the operator only."
      - "**Inbound:** guardrails refuse LoadBalancer Services and Ingress, cnp.sh down aborts if a LoadBalancer exists, GKE HTTP LB add-on disabled. Apps leave through outbound Cloudflare tunnels."
  - id: card-relays
    title: "Tunnel relays and cloud guardrails"
    color: amber
    lines:
      - "**onprem-apps (ns cnp-vpn, EKS and GKE):** 18080 and 18082 from ns observability only, 18083 from ns argo-rollouts only, UDP 51820 from anywhere (the SG / firewall keeps it to the K3s egress). Namespace selectors: any pod in those namespaces qualifies."
      - "**Guardrails:** three ValidatingAdmissionPolicies, Deny and failurePolicy Fail: cnp-deny-loadbalancer, cnp-deny-ingress, cnp-local-path-only (PVCs). Reason: no paid cloud resource."
      - "**On-prem end:** vminsert-writers and vmselect-readers admit the wireguard and wireguard-gcp pods; vmstorage takes only vminsert and vmselect."
      - "!!Gap!! The Loki gateway has no NetworkPolicy: any pod reaches it, basic auth is the only check. vminsert takes the relayed writes with no credential."
      - "**Kyverno on clouds:** disallow-latest-and-untagged-images, pod-security-restricted, require-resources-and-memory-limits. Enforce or Audit: not checked."
  - id: card-guard
    title: "GitOps guard rails"
    color: orange
    lines:
      - "**Tenant AppProject <p>:** blacklists cilium.io/*, NetworkPolicy, ResourceQuota and LimitRange. A tenant app cannot weaken or remove its own isolation. Destinations: only <p>-<app> namespaces on its target cloud."
      - "**Platform AppProject <p>-platform:** only the chart cnp-project-base, which installs the policies. Destinations: <p>-system, plus the app namespaces on clouds; a few whitelisted cluster objects."
  - id: card-sources
    title: "Sources"
    color: slate
    lines:
      - "cnp-project-base/templates/{ccnp,networkpolicy,app-project}.yaml · infra-templates/templates/ · K3s/k8s/config/argocd · K3s/k8s/config/observability/{vm,loki}-networkpolicies"
      - "Cloud/terraform/public/{aws/EKS,gcp/GKE}/main.tf (VPC CNI, SG, Dataplane V2, firewall) · */kubernetes/onprem-apps-netpol.yaml · platform/guardrails.yaml · platform/kyverno/policies"
      - "Live matrix 18/10 on letestaws (EKS) and letestgcp (GKE)."
