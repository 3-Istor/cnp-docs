apiVersion: noodle/v1alpha1
kind: View
type: topology
title: "CNP · Repo import · Worker callbacks"
subtitle: "How does an import job reach the CMP, who checks its identity, and what does the CMP then write?"
meta:
  - "Scope: the calls of the import workflow to the CMP worker API, on-prem, as of 2026-11-14 · runners in view import-runners"
  - "Sources: K3s k8s/config/arcl-cmp/{import-worker-route,api-jwt,cmp-values}.yaml · CMP services/imports/{oidc,deploy,generate,watch}.py · extern-project-analyzer cnp_analyzer/worker.py"
  - "Out of scope: the build itself (view import-runners) · Argo CD sync and the smoke check (sequence import-apply) · the user's browser path"
  - "v0.1 · source: cnp-docs/architecture/cnp"

