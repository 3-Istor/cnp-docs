labels:
  c-rn-ephemeral-actions: ""
  c-ic-runner-oidc: ""
  e-oidc-platform-tunnel: ""
  e-oidc-platform-envoy: "forward cmp.3istor.com · HTTP"
  c-im-import-registry: ""
  c-ic-import-jwks: ""
  c-ic-envoy-jwks: ""
  c-ic-import-vault-role: ""
  c-ic-import-vault-kv: ""
  c-ic-envoy-import: ""
  r-ic-route-gateway: ""
  c-rn-ephemeral-cmp: ""
  e-oidc-token-hairpin: ""
  r-ic-jwt-route: ""

notes:
  - {id: n-401, text: "Envoy answers 401 to a JWT from any other issuer or audience. The Keycloak policy of cmp-route-route would refuse a GitHub token: hence the dedicated route."}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true}
  - id: card-steps
    title: "Request path · a callback of the import workflow"
    color: emerald
    lines:
      - "[1] The CMP dispatches import.yml on main with the CNP-Portal installation token, then polls the run status. [2] An ephemeral runner takes the job."
      - "[3] The job asks GitHub for an ID token with audience cmp-import, [4] and calls https://cmp.3istor.com/api/import/worker/* with it, User-Agent cnp-import-worker/1: Cloudflare refuses urllib's default one (error 1010)."
      - "[5] Relayed through the platform tunnel, [6] then Envoy matches HTTPRoute cmp-api-import-worker, whose SecurityPolicy checks the GitHub signature and the audience."
      - "[7] The CMP checks the claims again: repository and owner ids, workflow ref on main, job_workflow_sha in IMPORT_WORKFLOW_SHAS, workflow_dispatch, run id and attempt, runner_environment self-hosted."
      - "[8] For each app with a secret, the CMP writes the Kubernetes auth role <project>-<app>-role (policy project-<p>-read-policy, mount kubernetes on-prem, kubernetes-<cloud> otherwise), [9] the secrets under project-<p>/<app>/imports, [10] then one registry commit with the digests."
  - id: card-bg
    title: "Background"
    color: violet
    lines:
      - "[A] Envoy fetches the GitHub Actions JWKS. [B] The CMP caches it for 1 h, refetches on an unknown key id at most once a minute, and keeps the cached keys when GitHub is unreachable."
      - "[C] Argo CD picks the new record up and syncs the apps."
      - "Deleting an imported app deletes its Vault role. The chart (infra-templates#26) refuses any vaultPath outside project-<p>/<app> and any vaultRole other than <project>-<app>-role."
  - id: card-ops
    title: "Operating rule: allow each analyzer commit"
    color: rose
    lines:
      - "The workflow runs at the head of main of extern-project-analyzer, so **every commit merged on main** changes job_workflow_sha, even one that leaves import.yml alone."
      - "Until its full SHA is in IMPORT_WORKFLOW_SHAS (K3s arcl-cmp/cmp-values.yaml), every callback gets 401 and imports fail. Merge the analyzer PR, then the K3s PR that adds the SHA."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    lines:
      - "!!G3!! **Transport.** TLS ends at Cloudflare. In-cluster hops are plain HTTP, Vault included (tls_disable)."
      - "!!G4!! **Coupling.** Tunnels target Envoy's Service by name."
      - "!!G6!! **Token call.** No cluster-local path to auth.3istor.com found: likely hairpins via Cloudflare. Not used by this route."

