apiVersion: noodle/v1alpha1
kind: View
type: sequence
title: "CNP · Observability · From a burning error budget to Discord"
subtitle: "What happens, in order, when an app starts failing, until a developer mutes the alert from the portal?"
meta:
  - "Scope: one fast-burn SLO alert for a prod app, routing, mute, dead man's switch (proposal, waves V1 and V3)"
  - "Out of scope: canary analysis and rollback, log-based rules (same path from vmalert on)"
  - "v0.1 (2026-11-13, proposal, CNP-185) · source: cnp-docs/architecture/cnp"
participants: [vo-vmagent, vo-vmsingle, vo-vmalert, vo-alertmanager, discord, dev-a, cmp-backend, vo-deadman]
steps:
  - {id: s1, from: vo-vmagent, to: vo-vmsingle, over: c-vo-vmagent-vmsingle, text: "remote_write Envoy series, 30 s"}
  - {note: vo-vmsingle, text: "5xx of <app> rises to 4 %"}
  - {id: s2, from: vo-vmalert, to: vo-vmsingle, over: c-vo-vmalert-vmsingle, text: "evaluate SLO rules, extra_filters of the project"}
  - {reply: s2, text: "burn rate 14.4 over 1 h and 5 min"}
  - {id: s3, from: vo-vmalert, to: vo-alertmanager, over: c-vo-vmalert-am, text: "SLOFastBurn{app, project, severity=critical}"}
  - {note: vo-alertmanager, text: "route app webhook, else project, else platform; group 30 s"}
  - {id: s4, from: vo-alertmanager, to: discord, over: c-vo-am-discord, text: "one message: value, runbook, portal link, @here"}
  - {id: s5, from: dev-a, to: cmp-backend, over: c-dev-cmpapi, text: "Mute 1 h (member of the project)"}
  - {id: s6, from: cmp-backend, to: vo-alertmanager, over: c-vo-cmp-am, text: "POST silence, matcher project=<p> forced"}
  - {reply: s6, text: "silence id, shown in the Alerts tab"}
  - {id: s7, from: vo-alertmanager, to: vo-deadman, over: c-vo-am-deadman, text: "Watchdog ping every 5 min"}
  - {note: vo-deadman, text: "no ping for 15 min: the alert chain is down"}
  - {id: s8, from: vo-deadman, to: discord, over: c-vo-deadman-discord, text: "platform alert, outside the cluster"}
