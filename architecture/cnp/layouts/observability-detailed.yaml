edges:
  c-od-coll-wg: {from: od-c-coll.right@38px, to: od-c-wg.left@20px, waypoints: [[280, 298], [280, 326]]}
  c-od-readers-wg: {from: od-c-readers.right@38px, to: od-c-wg.left@56px, waypoints: [[290, 408], [290, 362]]}
  # Tunnel: the hub initiates, so it runs against the reading direction.
  c-od-tunnel: {from: od-wg-hub.left, to: od-c-wg.right, against_flow: true}
  c-od-wg-vmauth: {from: od-wg-hub.bottom, to: od-vmauth-clouds.top}
  c-od-vmauth-otel: {from: od-vmauth-clouds.bottom, to: od-otel.top}
  c-od-vmauth-vmsingle: {from: od-vmauth-clouds.right@20px, to: od-vmsingle.left@20px, waypoints: [[985, 462], [985, 774]]}
  c-od-vmauth-vlogs: {from: od-vmauth-clouds.right@45px, to: od-vlogs.left@15px, waypoints: [[1000, 487], [1000, 875]]}
  c-od-otel-vtraces: {from: od-otel.right, to: od-vtraces.left}
  c-od-vmagent-vmsingle: {from: od-vmagent.right, to: od-vmsingle.left@38px}
  c-od-fluent-vlogs: {from: od-fluent.right, to: od-vlogs.left@38px}
  # Project isolation (Grafana orgs) reads the three stores.
  c-od-iso-vtraces: {from: od-vmauth-projects.left@20px, to: od-vtraces.right@20px, waypoints: [[1310, 466], [1310, 668]], against_flow: true}
  c-od-iso-vmsingle: {from: od-vmauth-projects.left@44px, to: od-vmsingle.right@12px, waypoints: [[1320, 490], [1320, 766]], against_flow: true}
  c-od-iso-vlogs: {from: od-vmauth-projects.left@64px, to: od-vlogs.right@12px, waypoints: [[1330, 510], [1330, 872]], against_flow: true}
  c-od-grafana-iso: {from: od-grafana.left@38px, to: od-vmauth-projects.right@38px, against_flow: true}
  # The CMP reads the stores directly.
  c-od-cmp-vtraces: {from: od-cmp.left@10px, to: od-vtraces.right@55px, waypoints: [[1600, 562], [1600, 703]], against_flow: true}
  c-od-cmp-vmsingle: {from: od-cmp.left@25px, to: od-vmsingle.right@27px, waypoints: [[1612, 577], [1612, 781]], against_flow: true}
  c-od-cmp-vlogs: {from: od-cmp.left@40px, to: od-vlogs.right@30px, waypoints: [[1624, 592], [1624, 890]], against_flow: true}
  c-od-cmp-am: {from: od-cmp.left@55px, to: od-alertmanager.right@20px, waypoints: [[1660, 607], [1660, 1142]], against_flow: true}
  c-od-opencost-vmsingle: {from: od-opencost.left@20px, to: od-vmsingle.right@42px, waypoints: [[1636, 678], [1636, 796]], against_flow: true}
  c-od-rollouts-vmsingle: {from: od-rollouts.left@20px, to: od-vmsingle.right@57px, waypoints: [[1648, 784], [1648, 811]], against_flow: true}
  c-od-alert-vmsingle: {from: od-vmalert.left@10px, to: od-vmsingle.right@69px, waypoints: [[1296, 1026], [1296, 823]], against_flow: true}
  c-od-alert-vlogs: {from: od-vmalert.left@40px, to: od-vlogs.right@55px, waypoints: [[1306, 1056], [1306, 915]], against_flow: true}
  c-od-alert-am: {from: od-vmalert.bottom, to: od-alertmanager.top}
  c-od-am-discord: {from: od-alertmanager.right@38px, to: od-discord.left@16px}
