  od-wg-hub: {x: 20, y: 46, w: 210, h: 76}
  od-vmauth-clouds: {x: 20, y: 182, w: 210, h: 76}
  od-g-collect: {x: 20, y: 402, w: 250, h: 358}
  od-otel: {x: 20, y: 46, w: 210, h: 76}
  od-vmagent: {x: 20, y: 152, w: 210, h: 76}
  od-fluent: {x: 20, y: 258, w: 210, h: 76}
  od-g-store: {x: 330, y: 402, w: 250, h: 358}
  od-vtraces: {x: 20, y: 46, w: 210, h: 76}
  od-vmsingle: {x: 20, y: 152, w: 210, h: 76}
  od-vlogs: {x: 20, y: 258, w: 210, h: 76}
  od-g-iso: {x: 640, y: 200, w: 250, h: 146}
  od-vmauth-projects: {x: 20, y: 46, w: 210, h: 76}
  od-g-alert: {x: 640, y: 770, w: 250, h: 252}
  od-vmalert: {x: 20, y: 46, w: 210, h: 76}
  od-alertmanager: {x: 20, y: 152, w: 210, h: 76}
