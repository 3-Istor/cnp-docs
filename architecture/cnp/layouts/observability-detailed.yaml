apiVersion: noodle/v1alpha1
kind: Layout
canvas: {width: 1920, height: 1100}

# Clouds | tunnel | hub: intake and collect, Victoria stack, readers, Grafana | Discord.
# Rows are 150 px apart so every reader meets the tall stack box in a straight line.
elements:
  od-z-cloud: {x: 40, y: 200, w: 270, h: 520}
  od-c-coll: {x: 20, y: 106, w: 230, h: 90}
  od-c-wg: {x: 20, y: 256, w: 230, h: 90}
  od-c-readers: {x: 20, y: 406, w: 230, h: 90}
  od-z-hub: {x: 460, y: 200, w: 1100, h: 826}
  od-wg-hub: {x: 20, y: 256, w: 230, h: 90}
  od-vmauth-clouds: {x: 20, y: 406, w: 230, h: 90}
  od-collectors: {x: 20, y: 706, w: 230, h: 90}
  od-stack: {x: 290, y: 106, w: 250, h: 690}
  od-vmauth-projects: {x: 580, y: 106, w: 230, h: 90}
  od-cmp: {x: 580, y: 256, w: 230, h: 90}
  od-rollouts: {x: 580, y: 406, w: 230, h: 90}
  od-opencost: {x: 580, y: 556, w: 230, h: 90}
  od-alerts: {x: 580, y: 706, w: 230, h: 90}
  od-grafana: {x: 850, y: 106, w: 230, h: 90}
  od-z-out: {x: 1620, y: 842, w: 270, h: 170}
  od-discord: {x: 20, y: 64, w: 230, h: 90}

edges:
  c-od-coll-wg: {from: od-c-coll.bottom, to: od-c-wg.top}
  c-od-readers-wg: {from: od-c-readers.top, to: od-c-wg.bottom, against_flow: true}
  # Tunnel: the hub initiates, so it runs against the reading direction.
  c-od-tunnel: {from: od-wg-hub.left, to: od-c-wg.right, against_flow: true}
  c-od-wg-vmauth: {from: od-wg-hub.bottom, to: od-vmauth-clouds.top}
  c-od-vmauth-stack: {from: od-vmauth-clouds.right@45px, to: od-stack.left@345px}
  c-od-collectors-stack: {from: od-collectors.right@45px, to: od-stack.left@645px}
  c-od-grafana-iso: {from: od-grafana.left@45px, to: od-vmauth-projects.right@45px, against_flow: true}
  c-od-iso-stack: {from: od-vmauth-projects.left@45px, to: od-stack.right@45px, against_flow: true}
  c-od-cmp-stack: {from: od-cmp.left@45px, to: od-stack.right@195px, against_flow: true}
  c-od-rollouts-stack: {from: od-rollouts.left@45px, to: od-stack.right@345px, against_flow: true}
  c-od-opencost-stack: {from: od-opencost.left@45px, to: od-stack.right@495px, against_flow: true}
  c-od-alerts-stack: {from: od-alerts.left@45px, to: od-stack.right@645px, against_flow: true}
  c-od-alerts-discord: {from: od-alerts.right@45px, to: od-discord.left@45px}
