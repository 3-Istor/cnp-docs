  c-vo-audit-rgw: {from: vo-audit-record.right@30px, to: ceph-rgw.left@80px, waypoints: [[2620, 810], [2620, 450]]}
  r-rgw-auditbucket: {from: ceph-rgw.bottom, to: audit-bucket.top}

