  c-vo-grafana-vmauth: {from: vo-grafana.bottom, to: vo-vmauth.top}
  c-vo-grafana-vmsingle: {from: vo-grafana.right@20px, to: vo-vmsingle.left@85px, waypoints: [[910, 1100], [910, 880], [1400, 880], [1400, 465]], label_at: [1620, 465]}
  c-vo-vmauth-vmsingle: {from: vo-vmauth.right@20px, to: vo-vmsingle.left@110px, waypoints: [[925, 1230], [925, 897], [1420, 897], [1420, 490]], label_at: [1680, 490]}
  c-vo-vmauth-vlogs: {from: vo-vmauth.right@50px, to: vo-vlogs.left@85px, waypoints: [[940, 1260], [940, 914], [1520, 914], [1520, 705]], label_at: [1620, 705]}
  c-vo-cmp-vmsingle: {from: cmp-backend.right@10px, to: vo-vmsingle.left@135px, waypoints: [[414, 970], [414, 931], [1440, 931], [1440, 515]], label_at: [1620, 515]}
  c-vo-cmp-vlogs: {from: cmp-backend.right@25px, to: vo-vlogs.left@110px, waypoints: [[428, 985], [428, 948], [1540, 948], [1540, 730]], label_at: [1680, 730]}
  c-vo-cmp-vtraces: {from: cmp-backend.right@40px, to: vo-vtraces.left@95px, waypoints: [[442, 1000], [442, 965], [1600, 965], [1600, 895]], label_at: [1660, 895]}
  c-vo-rollouts-vmsingle: {from: argo-rollouts.right@40px, to: vo-vmsingle.left@160px, waypoints: [[486, 1240], [486, 982], [1460, 982], [1460, 540]], label_at: [1680, 540]}
  # Alerting.
  c-vo-vmalert-vmsingle: {from: vo-vmalert.right@25px, to: vo-vmsingle.left@185px, waypoints: [[1480, 1105], [1480, 565]], label_at: [1620, 565]}
  c-vo-vmalert-vlogs: {from: vo-vmalert.right@55px, to: vo-vlogs.left@135px, waypoints: [[1560, 1135], [1560, 755]], label_at: [1660, 755]}
  c-vo-vmalert-am: {from: vo-vmalert.bottom, to: vo-alertmanager.top}
  c-vo-cmp-am: {from: cmp-backend.right@55px, to: vo-alertmanager.left@50px, waypoints: [[456, 1015], [456, 1380], [1000, 1380], [1000, 1260]], label_at: [700, 1380]}
  c-cmp-discord: {from: cmp-backend.right@70px, to: discord.left@60px, waypoints: [[470, 1030], [470, 1420], [2640, 1420], [2640, 1320]], label_at: [2000, 1420]}
  c-vo-am-discord: {from: vo-alertmanager.right@70px, to: discord.left@40px, waypoints: [[2620, 1280], [2620, 1300]], label_at: [2000, 1280]}
  c-vo-am-deadman: {from: vo-alertmanager.right@30px, to: vo-deadman.left@60px, waypoints: [[2600, 1240], [2600, 1130]], label_at: [2000, 1240]}
  c-vo-deadman-discord: {from: vo-deadman.bottom, to: discord.top}
