edges:
  # Collect.
  c-vo-vmagent-targets: {from: vo-vmagent.left@20px, to: o-hub-targets.right@60px, against_flow: true}
  c-vo-vmagent-appotel: {from: vo-vmagent.left@60px, to: vo-app-otel.right@30px, waypoints: [[460, 440], [460, 600]], against_flow: true, label_at: [520, 440]}
  c-vo-vlagent-audit: {from: vo-vlagent.left@30px, to: o-audit-sources.right@45px, waypoints: [[445, 540], [445, 495]], against_flow: true, label_at: [520, 540]}
  c-vo-appotel-otelcol: {from: vo-app-otel.right@60px, to: vo-otelcol.left@55px, waypoints: [[480, 630], [480, 695]], label_at: [430, 630]}
  c-vo-ai-otelcol: {from: vo-ai-sources.right@40px, to: vo-otelcol.left@80px, waypoints: [[495, 730], [495, 720]], label_at: [440, 730]}
  # Write.
  c-vo-vmagent-vmsingle: {from: vo-vmagent.right@60px, to: vo-vmsingle.left@60px, label_at: [1100, 440]}
  c-vo-vlagent-vlogs: {from: vo-vlagent.right@45px, to: vo-vlogs.left@60px, waypoints: [[1280, 555], [1280, 680]], label_at: [1100, 555]}
  c-vo-otelcol-vtraces: {from: vo-otelcol.right@50px, to: vo-vtraces.left@55px, waypoints: [[1300, 690], [1300, 855]], label_at: [1100, 690]}
