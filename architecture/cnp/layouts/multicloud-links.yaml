  r-b-allow-wg: {from: b-allow.left@200px, to: b-wireguard.right@20px, waypoints: []}

  c-vo-mc-wg-vmauth: {from: wireguard-onprem.right@128px, to: vo-vmauth.top@270px, waypoints: [[1076, 1102], [1076, 1200], [950, 1200]]}
  c-vo-mc-vmagent-relay: {from: vo-c-vmagent.right@50px, to: b-wireguard.bottom@70px, waypoints: [[1836, 964], [1836, 728], [1610, 728]], against_flow: true}
  c-vo-mc-vlagent-relay: {from: vo-c-vlagent.right@45px, to: b-wireguard.bottom@135px, waypoints: [[1852, 1083], [1852, 716], [1675, 716]], against_flow: true}
  c-vo-mc-otel-relay: {from: vo-c-otelcol.right@50px, to: b-wireguard.bottom@200px, waypoints: [[1868, 1202], [1868, 704], [1740, 704]], against_flow: true}
  c-brollouts-relay-select: {from: b-rollouts.right@45px, to: b-wireguard.bottom@265px, waypoints: [[1884, 1321], [1884, 692], [1805, 692]], against_flow: true}

