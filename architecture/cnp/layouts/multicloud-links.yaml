apiVersion: noodle/v1alpha1
kind: Layout
canvas: {width: 2880, height: 2990}

# Left: operator and the buckets it writes. Then the hub, the clouds, GitHub. Hub to cloud
# links cross corridor 2 (x 1200-1500); the cloud zone stands for EKS and GKE; the hub keeps a right margin (x 1020-1200) where the
# six relays from the WireGuard pods drop to the observability group. against_flow: a cloud
# or the operator calling towards the hub or the buckets, against the reading direction.
elements:
  z-operator: {x: 40, y: 260, w: 420, h: 190}
  operator: {x: 30, y: 60, w: 360, h: 90}
  z-aws-shared: {x: 40, y: 510, w: 420, h: 440}
  endpoint-bucket: {x: 30, y: 60, w: 360, h: 90}
  tfstate-s3: {x: 30, y: 180, w: 360, h: 90}
  ssm-kubeconfig: {x: 30, y: 300, w: 360, h: 90}
  z-gcp-shared: {x: 40, y: 1010, w: 420, h: 190}
  tfstate-gcs: {x: 30, y: 60, w: 360, h: 100}

  z-cluster: {x: 600, y: 260, w: 600, h: 2122}
  pae-node-1: {x: 40, y: 60, w: 380, h: 80}
  g-secrets: {x: 40, y: 180, w: 380, h: 414}
  vso: {x: 40, y: 60, w: 300, h: 80}
  vault: {x: 40, y: 200, w: 300, h: 80}
  vault-auth: {x: 40, y: 304, w: 300, h: 80}
  g-vpn: {x: 40, y: 654, w: 380, h: 254}
  wireguard-onprem: {x: 40, y: 60, w: 300, h: 170}
  g-observability: {x: 40, y: 968, w: 380, h: 530}
  vm-vminsert: {x: 40, y: 90, w: 300, h: 80}
  loki-gateway: {x: 40, y: 250, w: 300, h: 80}
  vm-vmselect: {x: 40, y: 410, w: 300, h: 80}
  g-gitops: {x: 40, y: 1558, w: 380, h: 274}
  argocd: {x: 40, y: 60, w: 300, h: 80}
  image-updater: {x: 40, y: 164, w: 300, h: 80}
  g-cmp: {x: 40, y: 1892, w: 380, h: 170}
  cmp-backend: {x: 40, y: 60, w: 300, h: 80}

  z-cloud-a: {x: 1500, y: 260, w: 700, h: 920}
  b-apiserver: {x: 40, y: 60, w: 260, h: 170}
  b-wireguard: {x: 40, y: 270, w: 260, h: 150}
  b-allow: {x: 400, y: 90, w: 260, h: 220}
  b-nodes: {x: 400, y: 360, w: 260, h: 90}
  g-b-platform: {x: 20, y: 480, w: 360, h: 410}
  b-secret-op: {x: 20, y: 60, w: 260, h: 90}
  alloy-aws: {x: 20, y: 174, w: 260, h: 90}
  b-rollouts: {x: 20, y: 288, w: 260, h: 90}
  z-github: {x: 1500, y: 1810, w: 420, h: 410}
  github: {x: 30, y: 60, w: 360, h: 150}
  ghcr: {x: 30, y: 240, w: 360, h: 130}

notes:
  n-vault: {x: 40, y: 1260, w: 420, h: 150}

edges:
  # Operator column (corridor 1, x 460-600).
  c-op-pae: {from: operator.right@50px, to: pae-node-1.left@50px, label_at: [590, 370]}
  c-op-vault: {from: operator.right@20px, to: vault.left@55px, waypoints: [[530, 340], [530, 695]], label_at: [530, 500]}
  c-op-endpoint: {from: operator.bottom@300px, to: endpoint-bucket.top@300px, waypoints: []}
  c-op-ssm: {from: operator.right@62px, to: ssm-kubeconfig.right@45px, waypoints: [[500, 382], [500, 855]], against_flow: true, label_at: [500, 700]}
  c-op-state-s3: {from: operator.right@72px, to: tfstate-s3.right@45px, waypoints: [[485, 392], [485, 735]], against_flow: true, label_at: [485, 650]}
  c-op-state-gcs: {from: operator.right@82px, to: tfstate-gcs.right@60px, waypoints: [[470, 402], [470, 1130]], against_flow: true, label_at: [470, 1000]}
  c-wg-endpoint: {from: wireguard-onprem.left@45px, to: endpoint-bucket.right@55px, waypoints: [[575, 1019], [575, 625]], against_flow: true, label_at: [575, 800]}
  e-a-vso-vault: {from: vso.bottom@150px, to: vault.top@150px, waypoints: []}

  # Hub to clouds (corridor 2, one lane per edge).
  c-op-b-api: {from: pae-node-1.right@55px, to: b-apiserver.left@55px}
  c-vault-b-apiserver: {from: vault-auth.right@25px, to: b-apiserver.left@85px, waypoints: [[1236, 769], [1236, 405]], label_at: [1236, 560]}
  c-wg-eks: {from: wireguard-onprem.right@20px, to: b-wireguard.left@135px, waypoints: [[1268, 994], [1268, 665]], label_at: [1268, 900]}
  c-bsecret-vault: {from: b-secret-op.left@45px, to: vault.right@15px, waypoints: [[1396, 845], [1396, 655]], against_flow: true, label_at: [1396, 750]}
  c-argocd-b: {from: argocd.right@15px, to: b-apiserver.left@115px, waypoints: [[1428, 1893], [1428, 435]], label_at: [1120, 1893]}
  c-cmp-b-api: {from: cmp-backend.right@12px, to: b-apiserver.left@145px, waypoints: [[1460, 2224], [1460, 465]], label_at: [1250, 2224]}

  # Relays inside the tunnel: the cloud socat opens TCP to the on-prem tunnel IP.
  c-bwg-onprem-vm: {from: b-wireguard.left@60px, to: wireguard-onprem.right@45px, waypoints: [[1300, 590], [1300, 1019]], against_flow: true}
  c-bwg-onprem-loki: {from: b-wireguard.left@85px, to: wireguard-onprem.right@65px, waypoints: [[1316, 615], [1316, 1039]], against_flow: true}
  c-bwg-onprem-select: {from: b-wireguard.left@110px, to: wireguard-onprem.right@85px, waypoints: [[1332, 640], [1332, 1059]], against_flow: true}

  # On-prem end of the relays, down the hub's right margin into the observability group.
  c-wgonprem-vmselect: {from: wireguard-onprem.right@110px, to: vm-vmselect.top@160px, waypoints: [[1112, 1084], [1112, 1598], [840, 1598]]}
  c-wgonprem-lokigw: {from: wireguard-onprem.right@128px, to: loki-gateway.top@160px, waypoints: [[1076, 1102], [1076, 1436], [840, 1436]]}
  c-wgonprem-vminsert: {from: wireguard-onprem.right@146px, to: vm-vminsert.top@150px, waypoints: [[1040, 1120], [1040, 1280], [830, 1280]]}

  # The CMP reads metrics and logs (Environments, Activity) from the hub.
  c-cmp-lokigw: {from: cmp-backend.right@40px, to: loki-gateway.top@70px, waypoints: [[1165, 2252], [1165, 1418], [750, 1418]]}
  c-cmp-vmselect: {from: cmp-backend.right@68px, to: vm-vmselect.top@70px, waypoints: [[1180, 2280], [1180, 1580], [750, 1580]]}

  # Cloud clients of the relays: agents calling home, up into the cloud WireGuard pod.
  c-alloyaws-relay-vm: {from: alloy-aws.right@30px, to: b-wireguard.bottom@50px, waypoints: [[1816, 944], [1816, 724], [1590, 724]], against_flow: true}
  c-alloyaws-relay-loki: {from: alloy-aws.right@60px, to: b-wireguard.bottom@130px, waypoints: [[1834, 974], [1834, 708], [1670, 708]], against_flow: true}
  c-brollouts-relay-select: {from: b-rollouts.right@45px, to: b-wireguard.bottom@210px, waypoints: [[1852, 1073], [1852, 692], [1750, 692]], against_flow: true}

  # To GitHub, under the clouds.
  c-argocd-github: {from: argocd.right@60px, to: github.left@68px, label_at: [1250, 1938]}
  c-updater-github: {from: image-updater.right@25px, to: github.left@137px, label_at: [1250, 2007]}
  c-cmp-github: {from: cmp-backend.right@54px, to: github.left@100px, waypoints: [[1348, 2266], [1348, 1970]], label_at: [1348, 2210]}
  c-updater-ghcr: {from: image-updater.right@55px, to: ghcr.left@70px, waypoints: [[1332, 2037], [1332, 2120]], label_at: [1440, 2120]}
  c-b-nodes-ghcr: {from: b-nodes.right@45px, to: ghcr.left@100px, waypoints: [[2260, 665], [2260, 2260], [1480, 2260], [1480, 2150]], label_at: [2260, 900]}
  r-b-allow-api: {from: b-allow.left@30px, to: b-apiserver.right@60px, waypoints: []}
  r-b-allow-wg: {from: b-allow.left@200px, to: b-wireguard.right@20px, waypoints: []}

