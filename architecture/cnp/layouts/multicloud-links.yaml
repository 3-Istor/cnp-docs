apiVersion: noodle/v1alpha1
kind: Layout
canvas: {width: 2880, height: 3200}

# Left: operator and the buckets it writes. Then the hub, the clouds, GitHub. Hub to cloud
# links cross corridor 2 (x 1200-1500); the hub keeps a right margin (x 1020-1200) where the
# six relays from the WireGuard pods drop to the observability group. against_flow: a cloud
# or the operator calling towards the hub or the buckets, against the reading direction.
