  c-cmp-lokigw: {from: cmp-backend.right@40px, to: loki-gateway.top@70px, waypoints: [[1165, 2462], [1165, 1628], [750, 1628]]}
  c-cmp-vmselect: {from: cmp-backend.right@68px, to: vm-vmselect.top@70px, waypoints: [[1180, 2490], [1180, 1790], [750, 1790]]}

  # Cloud clients of the relays: agents calling home, up into the cloud WireGuard pod.
  c-alloyaws-relay-vm: {from: alloy-aws.right@30px, to: b-wireguard.bottom@50px, waypoints: [[1816, 944], [1816, 724], [1590, 724]], against_flow: true}
  c-alloyaws-relay-loki: {from: alloy-aws.right@60px, to: b-wireguard.bottom@130px, waypoints: [[1834, 974], [1834, 708], [1670, 708]], against_flow: true}
  c-brollouts-relay-select: {from: b-rollouts.right@45px, to: b-wireguard.bottom@210px, waypoints: [[1852, 1073], [1852, 692], [1750, 692]], against_flow: true}
  c-alloygcp-relay-vm: {from: alloy-gcp.right@30px, to: gke-wireguard.bottom@50px, waypoints: [[1816, 1924], [1816, 1704], [1590, 1704]], against_flow: true}
  c-alloygcp-relay-loki: {from: alloy-gcp.right@60px, to: gke-wireguard.bottom@130px, waypoints: [[1834, 1954], [1834, 1688], [1670, 1688]], against_flow: true}
  c-gkerollouts-relay-select: {from: gke-rollouts.right@45px, to: gke-wireguard.bottom@210px, waypoints: [[1852, 2053], [1852, 1672], [1750, 1672]], against_flow: true}

  # To GitHub, under the clouds.
  c-argocd-github: {from: argocd.right@60px, to: github.left@60px, waypoints: [[1300, 2148], [1300, 2340]], label_at: [1900, 2340]}
  c-updater-github: {from: image-updater.right@25px, to: github.left@90px, waypoints: [[1316, 2217], [1316, 2370]], label_at: [2000, 2370]}
  c-cmp-github: {from: cmp-backend.right@54px, to: github.left@120px, waypoints: [[1348, 2476], [1348, 2400]], label_at: [2100, 2400]}
  c-updater-ghcr: {from: image-updater.right@55px, to: ghcr.left@55px, waypoints: [[1332, 2247], [1332, 2515]], label_at: [1900, 2515]}
  c-b-nodes-ghcr: {from: b-nodes.right@45px, to: ghcr.left@80px, waypoints: [[2260, 665], [2260, 2540]], label_at: [2260, 900]}
  c-gke-nodes-ghcr: {from: gke-nodes.right@45px, to: ghcr.left@105px, waypoints: [[2290, 1645], [2290, 2565]], label_at: [2290, 1800]}
  r-b-allow-api: {from: b-allow.left@30px, to: b-apiserver.right@60px, waypoints: []}
  r-b-allow-wg: {from: b-allow.left@200px, to: b-wireguard.right@20px, waypoints: []}
  r-gke-allow-api: {from: gke-allow.left@30px, to: gke-apiserver.right@60px, waypoints: []}
  r-gke-allow-wg: {from: gke-allow.left@200px, to: gke-wireguard.right@20px, waypoints: []}

