  c-wgonprem-vmselect: {from: wireguard-onprem.right@110px, to: vm-vmselect.top@160px, waypoints: [[1112, 1084], [1112, 1808], [840, 1808]]}
  c-wgonprem-lokigw: {from: wireguard-onprem.right@128px, to: loki-gateway.top@160px, waypoints: [[1076, 1102], [1076, 1646], [840, 1646]]}
  c-wgonprem-vminsert: {from: wireguard-onprem.right@146px, to: vm-vminsert.top@150px, waypoints: [[1040, 1120], [1040, 1490], [830, 1490]]}
  c-wggcp-vmselect: {from: wireguard-onprem-gcp.right@110px, to: vm-vmselect.top@250px, waypoints: [[1130, 1278], [1130, 1826], [930, 1826]]}
  c-wggcp-lokigw: {from: wireguard-onprem-gcp.right@128px, to: loki-gateway.top@250px, waypoints: [[1094, 1296], [1094, 1664], [930, 1664]]}
  c-wggcp-vminsert: {from: wireguard-onprem-gcp.right@146px, to: vm-vminsert.top@240px, waypoints: [[1058, 1314], [1058, 1505], [920, 1505]]}

