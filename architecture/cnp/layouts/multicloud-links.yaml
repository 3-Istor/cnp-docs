  g-b-platform: {x: 20, y: 480, w: 360, h: 410}
  b-secret-op: {x: 20, y: 60, w: 260, h: 90}
  alloy-aws: {x: 20, y: 174, w: 260, h: 90}
  b-rollouts: {x: 20, y: 288, w: 260, h: 90}
