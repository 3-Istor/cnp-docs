edges:
  # Operator column (corridor 1, x 460-600).
  c-op-pae: {from: operator.right@50px, to: pae-node-1.left@50px, label_at: [590, 370]}
  c-op-vault: {from: operator.right@20px, to: vault.left@55px, waypoints: [[530, 340], [530, 695]], label_at: [530, 500]}
  c-op-endpoint: {from: operator.bottom@300px, to: endpoint-bucket.top@300px, waypoints: []}
  c-op-ssm: {from: operator.right@62px, to: ssm-kubeconfig.right@45px, waypoints: [[500, 382], [500, 855]], against_flow: true, label_at: [500, 700]}
  c-op-state-s3: {from: operator.right@72px, to: tfstate-s3.right@45px, waypoints: [[485, 392], [485, 735]], against_flow: true, label_at: [485, 650]}
  c-op-state-gcs: {from: operator.right@82px, to: tfstate-gcs.right@60px, waypoints: [[470, 402], [470, 1130]], against_flow: true, label_at: [470, 1000]}
  c-wg-endpoint: {from: wireguard-onprem.left@45px, to: endpoint-bucket.right@55px, waypoints: [[575, 1019], [575, 625]], against_flow: true, label_at: [575, 800]}
  e-a-vso-vault: {from: vso.bottom@150px, to: vault.top@150px, waypoints: []}

  # Hub to clouds (corridor 2, one lane per edge).
  c-op-b-api: {from: pae-node-1.right@55px, to: b-apiserver.left@55px}
  c-op-gke-api: {from: pae-node-1.right@25px, to: gke-apiserver.left@55px, waypoints: [[1220, 345], [1220, 1355]], label_at: [1120, 345]}
  c-vault-b-apiserver: {from: vault-auth.right@25px, to: b-apiserver.left@85px, waypoints: [[1236, 769], [1236, 405]], label_at: [1236, 560]}
  c-vault-gke-apiserver: {from: vault-auth.right@55px, to: gke-apiserver.left@85px, waypoints: [[1252, 799], [1252, 1385]], label_at: [1252, 1130]}
  c-wg-eks: {from: wireguard-onprem.right@20px, to: b-wireguard.left@135px, waypoints: [[1268, 994], [1268, 665]], label_at: [1268, 900]}
  c-wg-gke: {from: wireguard-onprem-gcp.right@20px, to: gke-wireguard.left@135px, waypoints: [[1284, 1188], [1284, 1645]], label_at: [1284, 1400]}
  c-bsecret-vault: {from: b-secret-op.left@45px, to: vault.right@15px, waypoints: [[1396, 845], [1396, 655]], against_flow: true, label_at: [1396, 750]}
  c-gkesecret-vault: {from: gke-secret-op.left@45px, to: vault.right@45px, waypoints: [[1412, 1825], [1412, 685]], against_flow: true, label_at: [1412, 1700]}
  c-argocd-b: {from: argocd.right@15px, to: b-apiserver.left@115px, waypoints: [[1428, 2103], [1428, 435]], label_at: [1120, 2103]}
  c-argocd-gke: {from: argocd.right@35px, to: gke-apiserver.left@115px, waypoints: [[1444, 2123], [1444, 1415]], label_at: [1250, 2123]}
  c-cmp-b-api: {from: cmp-backend.right@12px, to: b-apiserver.left@145px, waypoints: [[1460, 2434], [1460, 465]], label_at: [1250, 2434]}
  c-cmp-gke-api: {from: cmp-backend.right@26px, to: gke-apiserver.left@145px, waypoints: [[1476, 2448], [1476, 1445]], label_at: [1290, 2448]}

  # Relays inside the tunnel: the cloud socat opens TCP to the on-prem tunnel IP.
  c-bwg-onprem-vm: {from: b-wireguard.left@60px, to: wireguard-onprem.right@45px, waypoints: [[1300, 590], [1300, 1019]], against_flow: true}
  c-bwg-onprem-loki: {from: b-wireguard.left@85px, to: wireguard-onprem.right@65px, waypoints: [[1316, 615], [1316, 1039]], against_flow: true}
  c-bwg-onprem-select: {from: b-wireguard.left@110px, to: wireguard-onprem.right@85px, waypoints: [[1332, 640], [1332, 1059]], against_flow: true}
  c-gkewg-onprem-vm: {from: gke-wireguard.left@60px, to: wireguard-onprem-gcp.right@45px, waypoints: [[1380, 1570], [1380, 1213]], against_flow: true}
  c-gkewg-onprem-loki: {from: gke-wireguard.left@85px, to: wireguard-onprem-gcp.right@65px, waypoints: [[1364, 1595], [1364, 1233]], against_flow: true}
  c-gkewg-onprem-select: {from: gke-wireguard.left@110px, to: wireguard-onprem-gcp.right@85px, waypoints: [[1348, 1620], [1348, 1253]], against_flow: true}

