apiVersion: noodle/v1alpha1
kind: Layout
canvas: {width: 3140, height: 1620}

# Cloud left, tunnel in the corridor, on-prem doors then stores, alert chain below, Discord outside.
elements:
  z-cloud-a: {x: 40, y: 180, w: 1140, h: 900}
  g-b-platform: {x: 30, y: 70, w: 760, h: 640}
  b-obs-targets: {x: 20, y: 80, w: 280, h: 110}
  vo-c-vmagent: {x: 420, y: 60, w: 300, h: 90}
  vo-c-vlagent: {x: 420, y: 200, w: 300, h: 90}
  vo-c-otelcol: {x: 420, y: 340, w: 300, h: 100}
  b-rollouts: {x: 420, y: 500, w: 300, h: 90}
  b-wireguard: {x: 880, y: 230, w: 220, h: 260}
  b-apiserver: {x: 860, y: 700, w: 260, h: 90}
  z-cluster: {x: 1300, y: 180, w: 1350, h: 1000}
  g-vpn: {x: 40, y: 260, w: 340, h: 220}
  wireguard-onprem: {x: 20, y: 60, w: 300, h: 130}
  g-gitops: {x: 40, y: 680, w: 340, h: 160}
  argocd: {x: 20, y: 55, w: 300, h: 80}
  g-vo: {x: 460, y: 60, w: 860, h: 880}
  g-vo-read: {x: 30, y: 60, w: 340, h: 190}
  vo-vmauth: {x: 20, y: 55, w: 300, h: 120}
  g-vo-collect: {x: 30, y: 310, w: 340, h: 170}
  vo-otelcol: {x: 20, y: 55, w: 300, h: 100}
  g-vo-store: {x: 500, y: 60, w: 340, h: 520}
  vo-vmsingle: {x: 20, y: 55, w: 300, h: 120}
  vo-vlogs: {x: 20, y: 215, w: 300, h: 110}
  vo-vtraces: {x: 20, y: 365, w: 300, h: 110}
  g-vo-alert: {x: 30, y: 560, w: 340, h: 300}
  vo-vmalert: {x: 20, y: 55, w: 300, h: 90}
  vo-alertmanager: {x: 20, y: 190, w: 300, h: 100}
  z-internet: {x: 2720, y: 760, w: 380, h: 220}
  discord: {x: 40, y: 70, w: 300, h: 90}

edges:
  # Cloud collection.
  c-vo-mc-vmagent-targets: {from: vo-c-vmagent.left@45px, to: b-obs-targets.right@25px, against_flow: true}
  c-vo-mc-vlagent-targets: {from: vo-c-vlagent.left@45px, to: b-obs-targets.right@75px, waypoints: [[430, 495], [430, 405]], against_flow: true}
  c-vo-mc-apps-otelcol: {from: b-obs-targets.right@100px, to: vo-c-otelcol.left@60px, waypoints: [[450, 430], [450, 650]]}
  # Cloud to the tunnel: one relay port for every write.
  c-vo-mc-vmagent-relay: {from: vo-c-vmagent.right@30px, to: b-wireguard.left@50px, waypoints: [[860, 340], [860, 460]]}
  c-vo-mc-vlagent-relay: {from: vo-c-vlagent.right@50px, to: b-wireguard.left@90px}
  c-vo-mc-otel-relay: {from: vo-c-otelcol.right@30px, to: b-wireguard.left@130px, waypoints: [[860, 620], [860, 540]]}
  c-brollouts-relay-select: {from: b-rollouts.right@30px, to: b-wireguard.left@210px, waypoints: [[880, 780], [880, 620]]}
  # Through the tunnel.
  c-bwg-onprem-vm: {from: b-wireguard.right@140px, to: wireguard-onprem.left@50px}
  c-bwg-onprem-loki: {from: b-wireguard.right@160px, to: wireguard-onprem.left@70px}
  c-bwg-onprem-select: {from: b-wireguard.right@180px, to: wireguard-onprem.left@90px}
  c-wg-eks: {from: wireguard-onprem.left@115px, to: b-wireguard.right@205px, against_flow: true}
  c-argocd-b: {from: argocd.left@40px, to: b-apiserver.right@45px, waypoints: [[1240, 955], [1240, 925]], against_flow: true}
  # On-prem door, then the stores.
  c-vo-mc-wg-vmauth: {from: wireguard-onprem.right@20px, to: vo-vmauth.left@60px, waypoints: [[1710, 520], [1710, 415]]}
  c-vo-vmauth-otelcol: {from: vo-vmauth.bottom@150px, to: vo-otelcol.top@150px}
  c-vo-vmauth-vmsingle: {from: vo-vmauth.right@60px, to: vo-vmsingle.left@60px}
  c-vo-vmauth-vlogs: {from: vo-vmauth.right@85px, to: vo-vlogs.left@60px, waypoints: [[2160, 440], [2160, 575]], label_at: [2195, 575]}
  c-vo-vmauth-vtraces: {from: vo-vmauth.right@105px, to: vo-vtraces.left@95px, waypoints: [[2145, 460], [2145, 760]]}
  c-vo-otelcol-vtraces: {from: vo-otelcol.right@50px, to: vo-vtraces.left@60px, waypoints: [[2180, 655], [2180, 725]], label_at: [2180, 690]}
  # Alerts.
  c-vo-vmalert-vmsingle: {from: vo-vmalert.right@30px, to: vo-vmsingle.left@100px, waypoints: [[2215, 885], [2215, 455]]}
  c-vo-vmalert-vlogs: {from: vo-vmalert.right@60px, to: vo-vlogs.left@90px, waypoints: [[2235, 915], [2235, 605]], label_at: [2170, 915]}
  c-vo-vmalert-am: {from: vo-vmalert.bottom, to: vo-alertmanager.top}
  c-vo-am-discord: {from: vo-alertmanager.right@50px, to: discord.left@45px, waypoints: [[2685, 1040], [2685, 875]]}

cards:
  card-legend: {x: 40, y: 1160, w: 640, h: 420}
  card-steps: {x: 720, y: 1160, w: 1140, h: 300}
  card-bg: {x: 1900, y: 1160, w: 1200, h: 360}
