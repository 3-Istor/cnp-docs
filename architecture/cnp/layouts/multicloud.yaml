edges:
  # Request path, EKS.
  e-1-browser-edge: {from: user.right, to: cf-edge.left}
  c-b-tunnel-edge: {from: b-tunnel.left, to: cf-edge.right@60px, against_flow: true}
  c-b-tunnel-gw: {from: b-tunnel.right@70px, to: b-gateway.left@70px}
  c-b-gw-b1: {from: b-gateway.bottom@210px, to: b1-front.top@250px}
  c-b1-front-back: {from: b1-front.right@60px, to: b1-back.left@60px}
  c-b1-back-db: {from: b1-back.right@60px, to: b1-db.left@60px}
  # Same path, onprem and GKE.
  c-a-tunnel-edge: {from: a-tunnel.left, to: cf-edge.right@30px, waypoints: [[645, 395], [645, 1005]], against_flow: true}
  c-a-tunnel-gw: {from: a-tunnel.right@70px, to: a-gateway.left@70px}
  c-a-gw-a1: {from: a-gateway.bottom@210px, to: a1-front.top@250px}
  c-a1-front-back: {from: a1-front.right@60px, to: a1-back.left@60px}
  c-a1-back-db: {from: a1-back.right@60px, to: a1-db.left@60px}
  c-gke-tunnel-edge: {from: gke-tunnel.left, to: cf-edge.right@90px, waypoints: [[685, 1925], [685, 1065]], against_flow: true}
  c-gke-tunnel-gw: {from: gke-tunnel.right@70px, to: gke-gateway.left@70px}
  c-gke-gw-front: {from: gke-gateway.bottom@210px, to: gke-front.top@250px}
  c-gke-front-back: {from: gke-front.right@60px, to: gke-back.left@60px}
  c-gke-back-db: {from: gke-back.right@60px, to: gke-db.left@60px}

  # Hub to cloud API servers and WireGuard pods.
  c-argocd-b: {from: argocd.right@25px, to: b-apiserver.right@20px, waypoints: [[1115, 2895], [1115, 2595], [2365, 2595], [2365, 980]], against_flow: true, label_at: [1300, 2595]}
  c-argocd-gke: {from: argocd.right@55px, to: gke-apiserver.right@20px, waypoints: [[1130, 2925], [1130, 2610], [2380, 2610], [2380, 1870]], against_flow: true, label_at: [1420, 2610]}
  c-vault-b-apiserver: {from: vault.right@25px, to: b-apiserver.right@60px, waypoints: [[1515, 2895], [1515, 2625], [2395, 2625], [2395, 1020]], against_flow: true, label_at: [1650, 2625]}
  c-vault-gke-apiserver: {from: vault.right@55px, to: gke-apiserver.right@60px, waypoints: [[1530, 2925], [1530, 2640], [2410, 2640], [2410, 1910]], against_flow: true, label_at: [1750, 2640]}
  c-wg-eks: {from: wireguard-onprem.right@30px, to: b-wireguard.right@45px, waypoints: [[1880, 2900], [1880, 2655], [2425, 2655], [2425, 1125]], against_flow: true, label_at: [2000, 2655]}
  c-wg-gke: {from: wireguard-onprem-gcp.right@30px, to: gke-wireguard.right@45px, waypoints: [[2190, 2900], [2190, 2670], [2440, 2670], [2440, 2015]], against_flow: true, label_at: [2300, 2670]}
  # Cloud VSO to Vault.
  c-bsecret-vault: {from: b-secret-op.right@45px, to: vault.top@190px, waypoints: [[2455, 1545], [2455, 2685], [1380, 2685]], label_at: [2060, 2685]}
  c-gkesecret-vault: {from: gke-secret-op.right@45px, to: vault.top@220px, waypoints: [[2470, 2435], [2470, 2700], [1410, 2700]], label_at: [1500, 2700]}
  # Operator.
  c-op-vault: {from: operator.bottom@30px, to: vault.top@250px, waypoints: [[2680, 2715], [1440, 2715]], label_at: [2560, 2715]}
  c-op-endpoint: {from: operator.bottom@290px, to: endpoint-bucket.top@290px, label_at: [2940, 2735]}
  c-op-state-s3: {from: operator.bottom@110px, to: tfstate-s3.left@70px, waypoints: [[2760, 2735], [2580, 2735], [2580, 3010]], label_at: [2670, 2735]}
