  c-updater-github: {from: image-updater.right@60px, to: github.left@110px, waypoints: [[1115, 3138], [1115, 3335]], label_at: [2400, 3335]}
  c-updater-ghcr: {from: image-updater.right@25px, to: ghcr.left@55px, waypoints: [[1130, 3103], [1130, 3460]], label_at: [1500, 3460]}

