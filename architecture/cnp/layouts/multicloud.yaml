canvas: {width: 3060, height: 4000}

# Element boxes are relative to their parent zone. Edge waypoints are canvas
# coordinates. Left to right: user, Cloudflare, the three clusters stacked, the
# externals. The hub is last; its control-plane edges leave through the gap above it
# (y 2595-2715), climb the east corridor (x 2365-2485) and enter the cloud API
# servers and WireGuard pods from the east (against_flow).
