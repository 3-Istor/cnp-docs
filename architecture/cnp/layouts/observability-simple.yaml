apiVersion: noodle/v1alpha1
kind: Layout
canvas: {width: 1900, height: 1060}

# Clusters left, stores in the middle, readers right: readers query against the reading direction.
elements:
  s2-z-sources: {x: 40, y: 200, w: 360, h: 480}
  s2-onprem: {x: 30, y: 70, w: 300, h: 90}
  s2-cloud: {x: 30, y: 220, w: 300, h: 90}
  s2-opencost: {x: 30, y: 370, w: 300, h: 90}
  s2-z-store: {x: 520, y: 200, w: 360, h: 330}
  s2-vm: {x: 30, y: 70, w: 300, h: 90}
  s2-vlogs: {x: 30, y: 220, w: 300, h: 90}
  s2-z-read: {x: 1000, y: 200, w: 400, h: 420}
  s2-grafana: {x: 50, y: 70, w: 300, h: 90}
  s2-alerts: {x: 50, y: 190, w: 300, h: 90}
  s2-cmp: {x: 50, y: 310, w: 300, h: 90}
  s2-z-out: {x: 1500, y: 360, w: 360, h: 180}
  s2-discord: {x: 30, y: 60, w: 300, h: 80}

edges:
  c-s2-onprem-vm: {from: s2-onprem.right@30px, to: s2-vm.left@30px}
  c-s2-cloud-vm: {from: s2-cloud.right@30px, to: s2-vm.left@50px, waypoints: [[450, 450], [450, 320]]}
  c-s2-onprem-vlogs: {from: s2-onprem.right@60px, to: s2-vlogs.left@25px, waypoints: [[500, 330], [500, 445]]}
  c-s2-cloud-vlogs: {from: s2-cloud.right@60px, to: s2-vlogs.left@60px}
  c-s2-grafana-vm: {from: s2-grafana.left@20px, to: s2-vm.right@20px, against_flow: true}
  c-s2-grafana-vlogs: {from: s2-grafana.left@80px, to: s2-vlogs.right@20px, waypoints: [[950, 350], [950, 440]], against_flow: true}
  c-s2-alerts-vm: {from: s2-alerts.left@25px, to: s2-vm.right@42px, waypoints: [[990, 415], [990, 312]], against_flow: true}
  c-s2-alerts-vlogs: {from: s2-alerts.left@75px, to: s2-vlogs.right@45px, against_flow: true}
  c-s2-cmp-vm: {from: s2-cmp.left@25px, to: s2-vm.right@64px, waypoints: [[910, 535], [910, 334]], against_flow: true}
  c-s2-cmp-vlogs: {from: s2-cmp.left@65px, to: s2-vlogs.right@70px, waypoints: [[880, 575], [880, 490]], against_flow: true}
  # Below the stores: the CMP reads OpenCost of every cluster.
  c-s2-cmp-opencost: {from: s2-cmp.bottom, to: s2-opencost.bottom@150px, waypoints: [[1200, 740], [220, 740]], against_flow: true}
  c-s2-alerts-discord: {from: s2-alerts.right@45px, to: s2-discord.left@15px}

cards:
  card-legend: {x: 40, y: 820, w: 760, h: 200}
  card-read: {x: 840, y: 820, w: 1020, h: 200}
