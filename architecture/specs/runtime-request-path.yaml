edges:
  # Nominal request path (data plane): an already signed-in user. One number per connection.
  - {id: e-1-browser-edge, kind: flow, from: user, to: cf-edge, port: "TCP 443", label: "[1] GET app · HTTPS", path: [[156, 480], [350, 480]]}
  - {id: e-2-tunnel-app, kind: tunnel, from: cloudflared-app, to: cf-edge, port: "UDP 7844", against_flow: true, label: "[2] relayed via tunnel ◀<br>opened outbound · QUIC", label_at: [680, 655], path: [[790, 780], [680, 780], [680, 530], [610, 530]]}
  - {id: e-3-connector-envoy, kind: flow, from: cloudflared-app, to: envoy-shared-gateway, port: "TCP 80", label: "[3] forward · HTTP", label_at: [1100, 650], path: [[1020, 780], [1100, 780], [1100, 525], [1160, 525]]}
  - {id: e-4-envoy-service, kind: flow, from: envoy-shared-gateway, to: app-service, port: "TCP 8000", label: "[4] proxy · HTTP", label_at: [1515, 700], path: [[1440, 540], [1440, 700], [1590, 700], [1590, 740]]}
  - {id: e-5-service-pods, kind: flow, from: app-service, to: app-pods, port: "TCP 8080", label: "[5] DNAT", path: [[1700, 790], [1800, 790]]}
  - {id: e-6-pods-db, kind: flow, from: app-pods, to: cnpg, port: "TCP 5432", label: "[6] query · SQL", path: [[1920, 820], [1920, 920]]}

  # Authentication connections. Not numbered here: the order lives in the OIDC sequence diagram.
  - {id: e-oidc-platform-tunnel, kind: tunnel, from: cloudflared-platform, to: cf-edge, port: "UDP 7844", against_flow: true, label: "platform tunnel<br>opened outbound · QUIC", label_at: [700, 400], path: [[790, 360], [700, 360], [700, 440], [610, 440]]}
  - {id: e-oidc-platform-envoy, kind: auth, from: cloudflared-platform, to: envoy-shared-gateway, port: "TCP 80", label: "auth.3istor.com · HTTP", label_at: [1100, 405], path: [[1030, 360], [1100, 360], [1100, 472], [1160, 472]]}
  - {id: e-oidc-envoy-keycloak, kind: auth, from: envoy-shared-gateway, to: keycloak, port: "TCP 80", label: "OIDC · HTTP", path: [[1480, 480], [1640, 480]]}
  - {id: e-oidc-token-hairpin, kind: auth, from: envoy-shared-gateway, to: cf-edge, port: "TCP 443", against_flow: true, label: "OIDC token call · HTTPS · !!⚠ G6!!", label_at: [900, 495], path: [[1160, 495], [610, 495]]}

  # Background (control plane), lettered.
  - {id: e-a-vso-vault, kind: async, from: vso, to: vault, port: "TCP 8200", label: "[A] read · HTTP", path: [[2140, 390], [2140, 460]]}
  - {id: e-b-vso-secret, kind: async, from: vso, to: app-secret, label: "[B] write Secret · K8s API", label_at: [2150, 880], path: [[2250, 350], [2265, 350], [2265, 880], [1590, 880], [1590, 920]]}

  # Object references: configuration, not traffic.
  - {id: r-ctp-gateway, kind: link, from: client-traffic-policy, to: envoy-shared-gateway, label: "targetRef", path: [[1320, 382], [1320, 420]]}
  - {id: r-route-gateway, kind: link, from: httproute, to: envoy-shared-gateway, label: "parentRef", path: [[1280, 740], [1280, 540]]}
  - {id: r-policy-route, kind: link, from: security-policy, to: httproute, label: "targetRef", path: [[1280, 920], [1280, 820]]}
  - {id: r-policy-secret, kind: link, from: security-policy, to: app-secret, label: "clientSecret", path: [[1400, 960], [1480, 960]]}
  - {id: r-pods-secret, kind: link, from: app-pods, to: app-secret, label: "envFrom", label_at: [1730, 960], path: [[1800, 812], [1760, 812], [1760, 960], [1700, 960]]}

  - {id: x-cross-tenant, kind: blocked, from: g-tenant-a, to: g-tenant-b, label: "cross-tenant traffic: no Cilium policy in code · !!⚠ G1!!", label_at: [840, 1115], label_offset: [178, 0], path: [[840, 1080], [840, 1150]]}

notes:
  - {id: n-302, text: "Without a session, Envoy replies **302** to auth.3istor.com at [3]. The login that follows is in the OIDC sequence diagram.", x: 52, y: 590, w: 196, h: 90}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true, x: 40, y: 1340, w: 540, h: 420}
  - id: card-data-plane
    title: "Request path · data plane"
    color: cyan
    x: 610
    y: 1340
    w: 620
    h: 420
    lines:
      - "Nominal path of a user who already has a session."
      - "[1] Browser sends GET https://<app>-<project>.3istor.com. Cloudflare terminates TLS."
      - "[2] The edge relays the request back through the app tunnel, which cloudflared opened outbound at startup. No inbound port on-prem."
      - "[3] cloudflared forwards it to Envoy over plain HTTP. Envoy matches the HTTPRoute and checks the OIDC session cookie."
      - "[4] Envoy proxies to the Service."
      - "[5] Cilium DNATs the Service VIP to an app pod."
      - "[6] The app queries its CloudNativePG cluster."
      - "Pink connections carry the OIDC login. Their order is in the OIDC sequence diagram."
  - id: card-control-plane
    title: "Background · control plane"
    color: violet
    x: 1260
    y: 1340
    w: 460
    h: 420
    lines:
      - "[A] VSO logs in with a namespace-bound role and reads kvv2."
      - "[B] VSO writes the K8s Secret through the API server."
      - "Both cloudflared connectors open their tunnels outbound at startup."
      - "Dotted lines are object references (parentRef, targetRef, envFrom, clientSecret), not traffic."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    x: 1750
    y: 1340
    w: 550
    h: 420
    lines:
      - "!!G1!! **Network isolation.** Docs describe a default-deny CCNP per project. None in code: Cilium runs without tenant policy."
      - "!!G2!! **Authorization.** No groups-claim check: any account in realm 3istor opens any SSO app."
      - "!!G3!! **Transport.** TLS ends at Cloudflare. In-cluster hops are plain HTTP, Vault included (tls_disable)."
      - "!!G4!! **Coupling.** Tunnels target Envoy's hashed Service (ac1e5388). Blocks AWS/GCP. Covered by D-05."
      - "!!G5!! **Tunnels.** One per app, cloudflared on :latest. D-06 moves to one per project."
      - "!!G6!! **Token call.** The template expects a cluster-local path to auth.3istor.com. None found in code: likely hairpins via Cloudflare. To verify."
