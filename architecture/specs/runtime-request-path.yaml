id: runtime-request-path
title: "CNP · Runtime · Request path & tenant isolation"
subtitle: "How a user request reaches a tenant app, where it is authenticated, and what keeps tenants apart."
meta:
  - "Scope: on-prem K3s cluster · main as of 2026-09-26 · derived from code (infra-templates, K3s, CMP templates)"
  - "Out of scope: AWS/GCP clusters · observability · deployment pipeline · admin SSH access"
  - "v0.4 · source: architecture/specs/runtime-request-path.yaml"
